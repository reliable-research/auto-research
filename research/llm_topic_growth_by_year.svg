<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">LLM topic growth by year, 2022 to 2025</title>
  <desc id="desc">Line chart showing verifier and reward hacking, RAG and evidence, test-time compute, memory governance, planning and tool failure, and coding-agent maintainability shares from 2022 to 2025.</desc>
  <rect width="960" height="440" fill="#fbfaf7"/>
