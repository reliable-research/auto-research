<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">The Regret of Stopping — Hindsight-Oracle Measurement Pipeline</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#6b7280">one collection pass → all rules, λ values and decompositions are free CPU-side replays</text>

  <!-- Panel 1: trajectory generation -->
  <rect x="20" y="60" width="270" height="150" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="32" y="80" font-size="12.5" font-weight="bold" fill="#1f2937">1 · Trajectory generation + probe overlay</text>
  <text x="32" y="97" font-size="10" fill="#374151">DeepSeek-R1-Distill-7B × GSM8K / MATH-500 /</text>
  <text x="32" y="111" font-size="10" fill="#374151">GPQA-Diamond (~500 instances each)</text>
  <text x="32" y="125" font-size="10" fill="#374151">checkpoints k at “Wait” / “Alternatively”</text>
  <text x="32" y="139" font-size="10" fill="#374151">N=8 forced-answer probes, prefix-KV reuse</text>
  <text x="32" y="153" font-size="10" fill="#374151">signals: conf · entropy ×2 · vote · stability</text>
  <text x="32" y="167" font-size="10" fill="#374151">branch-isolation invariant (unit-tested)</text>
  <!-- mini trajectory sketch -->
  <line x1="40" y1="192" x2="265" y2="192" stroke="#4a7ab5" stroke-width="1.5"/>
  <g stroke="#4a7ab5" stroke-width="1">
    <line x1="70" y1="192" x2="62" y2="180"/><line x1="115" y1="192" x2="107" y2="180"/>
    <line x1="160" y1="192" x2="152" y2="180"/><line x1="205" y1="192" x2="197" y2="180"/>
    <line x1="250" y1="192" x2="242" y2="180"/>
  </g>
  <g fill="#4a7ab5">
    <circle cx="70" cy="192" r="2.6"/><circle cx="115" cy="192" r="2.6"/><circle cx="160" cy="192" r="2.6"/>
    <circle cx="205" cy="192" r="2.6"/><circle cx="250" cy="192" r="2.6"/>
  </g>
  <text x="40" y="205" font-size="8.5" fill="#4a7ab5">main trace continues — probes branch off frozen prefix</text>

  <!-- Panel 2: oracle -->
  <rect x="310" y="60" width="290" height="150" rx="8" fill="#eefaf2" stroke="#3d9970" stroke-width="1.5"/>
  <text x="322" y="80" font-size="12.5" font-weight="bold" fill="#1f2937">2 · Uncertainty-calibrated hindsight oracle</text>
  <text x="322" y="97" font-size="10" fill="#374151">U_λ(k) = â_k − λ·c_k on the logged lattice</text>
  <text x="322" y="111" font-size="10" fill="#374151">paired block bootstrap → joint utility curves</text>
  <text x="322" y="125" font-size="10" fill="#374151">sup-t simultaneous bands (argmax-aware)</text>
  <text x="322" y="139" font-size="10" fill="#374151">split-conformal oracle set S(x, λ), 90% target</text>
  <text x="322" y="153" font-size="10" fill="#374151">N=32 audit re-probe → instrument error bar</text>
  <!-- mini utility curve with band -->
  <path d="M 330 204 C 375 184 410 196 455 184 C 495 172 540 188 585 196 L 585 207 L 330 207 Z" fill="#3d9970" opacity="0.15"/>
  <path d="M 330 197 C 375 176 410 188 455 176 C 495 166 540 180 585 188" fill="none" stroke="#3d9970" stroke-width="1.8"/>
  <path d="M 330 190 C 375 168 410 180 455 168 C 495 158 540 172 585 180" fill="none" stroke="#3d9970" stroke-width="0.8" stroke-dasharray="3 2"/>
  <circle cx="468" cy="172" r="3.2" fill="#166534"/>
  <text x="476" y="170" font-size="8.5" fill="#166534">t*(x,λ) ∈ S(x,λ)</text>

  <!-- Panel 3: rule zoo -->
  <rect x="620" y="60" width="260" height="150" rx="8" fill="#fdf6e8" stroke="#c9912a" stroke-width="1.5"/>
  <text x="632" y="80" font-size="12.5" font-weight="bold" fill="#1f2937">3 · Stopping-rule zoo (causal replay)</text>
  <text x="632" y="97" font-size="10" fill="#374151">fixed-budget · confidence-τ (DEER-style)</text>
  <text x="632" y="111" font-size="10" fill="#374151">entropy-τ ×2 · vote-share · answer-stability</text>
  <text x="632" y="125" font-size="10" fill="#374151">learned estimator (logistic / ≤2-layer MLP)</text>
  <text x="632" y="139" font-size="10" fill="#374151">+ oracle (upper) and never-stop (lower) anchors</text>
  <text x="632" y="157" font-size="10" fill="#7c5514">thresholds calibrated per λ on dev split</text>
  <text x="632" y="171" font-size="10" fill="#7c5514">replayed on identical logs via the corpus (6)</text>
  <text x="632" y="185" font-size="10" fill="#7c5514">causal API: rules see H_k, never verifier labels</text>

  <!-- Panel 6: corpus -->
  <rect x="20" y="250" width="270" height="150" rx="8" fill="#f0f2f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="32" y="270" font-size="12.5" font-weight="bold" fill="#1f2937">6 · Replayable sealed corpus</text>
  <text x="32" y="287" font-size="10" fill="#374151">content-addressed records + SHA-256 manifest</text>
  <text x="32" y="301" font-size="10" fill="#374151">taint checks + randomized hindsight canaries</text>
  <text x="32" y="315" font-size="10" fill="#374151">serves (3) causal views; seals evidence for (4)</text>
  <text x="32" y="329" font-size="10" fill="#374151">future rules scored on CPU — no model access</text>
  <rect x="40" y="345" width="110" height="40" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="95" y="361" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">causal namespace</text>
  <text x="95" y="375" text-anchor="middle" font-size="8.5" fill="#475569">prefixes · signals · c_k</text>
  <rect x="165" y="345" width="110" height="40" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="4 2"/>
  <text x="220" y="361" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">sealed namespace</text>
  <text x="220" y="375" text-anchor="middle" font-size="8.5" fill="#475569">labels · oracle draws</text>

  <!-- Panel 4: regret decomposition -->
  <rect x="310" y="250" width="290" height="150" rx="8" fill="#f6effa" stroke="#8e5bb5" stroke-width="1.5"/>
  <text x="322" y="270" font-size="12.5" font-weight="bold" fill="#1f2937">4 · Regret decomposition (per oracle draw b)</text>
  <text x="322" y="288" font-size="10.5" fill="#374151">R_b = U_b(t*_b, λ) − U_b(τ, λ)  ≥  0</text>
  <text x="322" y="303" font-size="10" fill="#374151">early: τ &lt; t*_b · late: τ &gt; t*_b · tie: zero regret</text>
  <text x="322" y="317" font-size="10" fill="#374151">additive inside every draw; direction becomes a</text>
  <text x="322" y="331" font-size="10" fill="#374151">calibrated probability, not a brittle label</text>
  <!-- mini stacked bars -->
  <line x1="340" y1="388" x2="560" y2="388" stroke="#8e5bb5" stroke-width="1"/>
  <rect x="355" y="362" width="26" height="26" fill="#f2b06b"/><rect x="355" y="350" width="26" height="12" fill="#c05560"/>
  <rect x="415" y="372" width="26" height="16" fill="#f2b06b"/><rect x="415" y="352" width="26" height="20" fill="#c05560"/>
  <rect x="475" y="380" width="26" height="8" fill="#f2b06b"/><rect x="475" y="374" width="26" height="6" fill="#c05560"/>
  <text x="368" y="398" text-anchor="middle" font-size="8" fill="#6b21a8">rule A</text>
  <text x="428" y="398" text-anchor="middle" font-size="8" fill="#6b21a8">rule B</text>
  <text x="488" y="398" text-anchor="middle" font-size="8" fill="#6b21a8">learned</text>
  <rect x="516" y="352" width="8" height="8" fill="#f2b06b"/><text x="528" y="359" font-size="8" fill="#374151">early</text>
  <rect x="516" y="364" width="8" height="8" fill="#c05560"/><text x="528" y="371" font-size="8" fill="#374151">late</text>

  <!-- Panel 5: reports -->
  <rect x="620" y="250" width="260" height="150" rx="8" fill="#fbeff0" stroke="#c05560" stroke-width="1.5"/>
  <text x="632" y="270" font-size="12.5" font-weight="bold" fill="#1f2937">5 · Reports: λ grid × difficulty strata</text>
  <text x="632" y="287" font-size="10" fill="#374151">λ ∈ log grid 0.01–3 acc-pts / 1K tokens</text>
  <text x="632" y="301" font-size="10" fill="#374151">regret + headroom curves ± bootstrap CI</text>
  <text x="632" y="315" font-size="10" fill="#374151">early/late split by difficulty decile</text>
  <text x="632" y="329" font-size="10" fill="#374151">ranking stability (Kendall's τ) across λ</text>
  <text x="632" y="343" font-size="10" fill="#374151">dual probe-cost accounting (charged / excluded)</text>
  <!-- mini regret-vs-lambda curves -->
  <line x1="640" y1="390" x2="860" y2="390" stroke="#c05560" stroke-width="1"/>
  <line x1="640" y1="390" x2="640" y2="355" stroke="#c05560" stroke-width="1"/>
  <path d="M 642 362 C 700 366 760 376 856 384" fill="none" stroke="#c05560" stroke-width="1.6"/>
  <path d="M 642 372 C 700 378 760 370 856 362" fill="none" stroke="#c9912a" stroke-width="1.6" stroke-dasharray="4 2"/>
  <text x="750" y="401" text-anchor="middle" font-size="8" fill="#9f1239">regret vs λ — rankings may invert</text>

  <!-- Panel: pilot gates -->
  <rect x="20" y="440" width="860" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="34" y="462" font-size="12.5" font-weight="bold" fill="#1f2937">Pilot gates (go / no-go) — every stage above is gated before scaling</text>
  <rect x="40" y="474" width="256" height="100" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="52" y="492" font-size="10.5" font-weight="bold" fill="#92400e">Gate A — week-1 dry run (50 inst.)</text>
  <text x="52" y="508" font-size="9.5" fill="#374151">probe cost ≤ 2× projection (KV reuse)</text>
  <text x="52" y="522" font-size="9.5" fill="#374151">branch-isolation invariant passes</text>
  <text x="52" y="536" font-size="9.5" fill="#374151">median K ∈ [10, 30]</text>
  <text x="52" y="554" font-size="9" fill="#b45309">hard fail → shrink scope / retarget venue</text>
  <rect x="330" y="474" width="256" height="100" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="342" y="492" font-size="10.5" font-weight="bold" fill="#92400e">Gate B — week-2 slice (300 inst.)</text>
  <text x="342" y="508" font-size="9.5" fill="#374151">best signal separates from fixed-budget</text>
  <text x="342" y="522" font-size="9.5" fill="#374151">at ≥ 80% power for full-pilot n</text>
  <text x="342" y="536" font-size="9.5" fill="#374151">instrument error &lt; min between-rule gap</text>
  <text x="342" y="554" font-size="9" fill="#b45309">fail → redesign probes before scaling</text>
  <rect x="620" y="474" width="240" height="100" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="632" y="492" font-size="10.5" font-weight="bold" fill="#92400e">Pivot path (not a death)</text>
  <text x="632" y="508" font-size="9.5" fill="#374151">calibrated heuristics ≈ zero regret</text>
  <text x="632" y="522" font-size="9.5" fill="#374151">across λ on ≥ 2 benchmarks →</text>
  <text x="632" y="536" font-size="9.5" fill="#374151">audit-style short paper:</text>
  <text x="632" y="550" font-size="9.5" fill="#374151">“online stopping is solved here”</text>
  <line x1="296" y1="524" x2="330" y2="524" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="586" y1="524" x2="620" y2="524" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- flow arrows -->
  <line x1="290" y1="135" x2="308" y2="135" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="299" y="126" text-anchor="middle" font-size="8.5" fill="#475569">â_k</text>
  <line x1="155" y1="210" x2="155" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="163" y="233" font-size="8.5" fill="#475569">logs</text>
  <line x1="455" y1="210" x2="455" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="463" y="233" font-size="8.5" fill="#475569">oracle draws t*_b</text>
  <line x1="660" y1="210" x2="575" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="640" y="233" font-size="8.5" fill="#475569">stops τ_π</text>
  <line x1="600" y1="325" x2="618" y2="325" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="450" y1="400" x2="450" y2="438" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
