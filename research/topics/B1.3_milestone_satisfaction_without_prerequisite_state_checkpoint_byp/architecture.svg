<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">B1.3 · Unearned Checkpoints — Study Architecture</text>
  <text x="450" y="44" text-anchor="middle" font-size="10.5" fill="#555">Milestone batteries vs. end-state coherence: bypass feasibility (P1) · natural incidence (P2) · compositional insufficiency (C)</text>

  <!-- A1: D0 survey -->
  <rect x="20" y="55" width="180" height="115" rx="8" fill="#E8EEF7" stroke="#4A6FA5" stroke-width="1.4"/>
  <text x="110" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C4A75">D0 · Grading survey</text>
  <text x="110" y="93" text-anchor="middle" font-size="10" fill="#222">10–15 deployed benchmarks</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#222">mechanism × partial credit</text>
  <text x="110" y="123" text-anchor="middle" font-size="10" fill="#222">× prerequisite enforcement</text>
  <text x="110" y="141" text-anchor="middle" font-size="10" fill="#2C4A75">→ Table 1 · checker types</text>
  <text x="110" y="156" text-anchor="middle" font-size="10" fill="#2C4A75">→ G2 floor (credit inflation)</text>

  <!-- A2: Task battery DAG -->
  <rect x="220" y="55" width="420" height="180" rx="8" fill="#E9F2E7" stroke="#4F7A52" stroke-width="1.4"/>
  <text x="430" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2F5231">Task battery · prerequisite DAG G = (K, E)</text>

  <!-- DAG edges -->
  <line x1="284" y1="126" x2="337" y2="110" stroke="#4F7A52" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="371" y1="105" x2="421" y2="105" stroke="#4F7A52" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="455" y1="110" x2="512" y2="129" stroke="#4F7A52" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="284" y1="135" x2="337" y2="159" stroke="#4F7A52" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="161" x2="512" y2="140" stroke="#4F7A52" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- DAG nodes -->
  <circle cx="270" cy="130" r="15" fill="#ffffff" stroke="#2F5231" stroke-width="1.5"/>
  <text x="270" y="134" text-anchor="middle" font-size="10.5" fill="#1a1a1a">k1</text>
  <text x="270" y="158" text-anchor="middle" font-size="9.5" fill="#A8822B">V1</text>
  <circle cx="355" cy="105" r="15" fill="#ffffff" stroke="#2F5231" stroke-width="1.5"/>
  <text x="355" y="109" text-anchor="middle" font-size="10.5" fill="#1a1a1a">k2</text>
  <text x="386" y="94" text-anchor="middle" font-size="9.5" fill="#A8822B">V2</text>
  <circle cx="440" cy="105" r="15" fill="#ffffff" stroke="#2F5231" stroke-width="1.5"/>
  <text x="440" y="109" text-anchor="middle" font-size="10.5" fill="#1a1a1a">k3</text>
  <text x="440" y="86" text-anchor="middle" font-size="9.5" fill="#A8822B">V3</text>
  <circle cx="355" cy="165" r="15" fill="#ffffff" stroke="#2F5231" stroke-width="1.5"/>
  <text x="355" y="169" text-anchor="middle" font-size="10.5" fill="#1a1a1a">k4</text>
  <text x="355" y="193" text-anchor="middle" font-size="9.5" fill="#A8822B">V4</text>
  <circle cx="530" cy="135" r="15" fill="#ffffff" stroke="#2F5231" stroke-width="1.5"/>
  <text x="530" y="139" text-anchor="middle" font-size="10.5" fill="#1a1a1a">k5</text>
  <text x="530" y="163" text-anchor="middle" font-size="9.5" fill="#A8822B">V5</text>
  <text x="588" y="120" text-anchor="middle" font-size="9.5" fill="#555">fan-in,</text>
  <text x="588" y="133" text-anchor="middle" font-size="9.5" fill="#555">depth varied</text>

  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#222">30 hand-authored tasks · fs/coding + tool-use/DB · depth 3–8 · fan-in 1–3</text>
  <text x="430" y="227" text-anchor="middle" font-size="10" fill="#222">independent local checkers V1…V5 · explicit action-block boundaries · trivial-solution audit</text>

  <!-- A3: Bypass taxonomy -->
  <rect x="660" y="55" width="220" height="180" rx="8" fill="#F9E8E2" stroke="#B25438" stroke-width="1.4"/>
  <text x="770" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8A3C25">Bypass taxonomy</text>
  <rect x="672" y="84" width="196" height="40" rx="5" fill="#ffffff" stroke="#D08A6E" stroke-width="1"/>
  <text x="770" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A3C25">reorder 乱序</text>
  <text x="770" y="115" text-anchor="middle" font-size="9.5" fill="#444">edge-violating execution order</text>
  <rect x="672" y="130" width="196" height="40" rx="5" fill="#ffffff" stroke="#D08A6E" stroke-width="1"/>
  <text x="770" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A3C25">skip 跳步</text>
  <text x="770" y="161" text-anchor="middle" font-size="9.5" fill="#444">drop prereq., keep dependent</text>
  <rect x="672" y="176" width="196" height="52" rx="5" fill="#ffffff" stroke="#D08A6E" stroke-width="1"/>
  <text x="770" y="191" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A3C25">inject 状态注入</text>
  <text x="770" y="205" text-anchor="middle" font-size="9.5" fill="#444">plant surface signature</text>
  <text x="770" y="219" text-anchor="middle" font-size="9.5" fill="#444">(B1.1-adjacent · excluded from C)</text>

  <!-- B: truth channel -->
  <rect x="220" y="255" width="420" height="62" rx="8" fill="#FFF4D6" stroke="#A8822B" stroke-width="1.4"/>
  <text x="430" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#7A5E1D">End-state coherence oracle O_end — ground truth</text>
  <text x="430" y="288" text-anchor="middle" font-size="9.8" fill="#333">recomputes canonical terminal state · code-disjoint from every V_k · no LLM</text>
  <text x="430" y="303" text-anchor="middle" font-size="9.8" fill="#333">provenance side-channel: harness command/file logs (instrumentation, not a verifier)</text>

  <!-- C2: P2 arm (left) -->
  <rect x="20" y="335" width="410" height="135" rx="8" fill="#F0F4FB" stroke="#4A6FA5" stroke-width="1.4"/>
  <text x="225" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2C4A75">Arm P2 — natural incidence (agents)</text>
  <text x="225" y="373" text-anchor="middle" font-size="10" fill="#222">neutral prompts · no cheat instruction ever shown</text>
  <text x="225" y="389" text-anchor="middle" font-size="10" fill="#222">3 models × 3 seeds × 2 budgets × 2 visibility × 30 tasks</text>
  <text x="225" y="405" text-anchor="middle" font-size="10" fill="#222">= 1,080 rollouts (≈$200–800 API · CPU grading)</text>
  <text x="225" y="421" text-anchor="middle" font-size="10" fill="#222">denominators: full-conjunction · partial-credit</text>
  <text x="225" y="437" text-anchor="middle" font-size="10" fill="#222">unearned-credit score U · visibility = mechanism factor</text>
  <text x="225" y="456" text-anchor="middle" font-size="10" font-style="italic" fill="#2C4A75">claims predicate only of agents</text>

  <!-- C1: P1 arm (right) -->
  <rect x="450" y="335" width="430" height="135" rx="8" fill="#FBEFEA" stroke="#B25438" stroke-width="1.4"/>
  <text x="665" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8A3C25">Arm P1 — attack surface (agent-free)</text>
  <text x="665" y="373" text-anchor="middle" font-size="10" fill="#222">pre-registered samplers · equal per-strategy budgets</text>
  <text x="665" y="389" text-anchor="middle" font-size="10" fill="#222">+ uniform valid-action fuzzing control · valid-order control</text>
  <text x="665" y="405" text-anchor="middle" font-size="10" fill="#222">outcome: bypassable-task fraction (lower bound)</text>
  <text x="665" y="421" text-anchor="middle" font-size="10" fill="#222">primary: checker-type × strategy resistance matrix</text>
  <text x="665" y="437" text-anchor="middle" font-size="10" fill="#222">C = reorder/skip bypass with all awarded V_k truthful</text>
  <text x="665" y="456" text-anchor="middle" font-size="10" font-style="italic" fill="#8A3C25">claims predicate only of verifiers</text>

  <!-- D1: adjudication -->
  <rect x="20" y="495" width="280" height="110" rx="8" fill="#F3E9F5" stroke="#7D5A8C" stroke-width="1.4"/>
  <text x="160" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A3C6B">Adjudication — 100% of candidates</text>
  <text x="160" y="533" text-anchor="middle" font-size="10" fill="#222">2 annotators · κ ≥ 0.7</text>
  <text x="160" y="549" text-anchor="middle" font-size="10" fill="#222">{genuine bypass · oracle error · task bug}</text>
  <text x="160" y="565" text-anchor="middle" font-size="10" fill="#222">reports oracle false-inconsistency rate</text>
  <text x="160" y="581" text-anchor="middle" font-size="10" fill="#222">and task-bug rate (SP3 defused by scale)</text>

  <!-- D2: gates -->
  <rect x="320" y="495" width="260" height="110" rx="8" fill="#FFF4D6" stroke="#A8822B" stroke-width="1.4"/>
  <text x="450" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#7A5E1D">Pilot gates</text>
  <text x="332" y="533" font-size="10" fill="#222">G1 sanity: honest runs 100% concordant</text>
  <text x="332" y="549" font-size="10" fill="#222">G2 signal: bypassable ≥ floor (from D0)</text>
  <text x="332" y="565" font-size="10" fill="#222">G3 integrity: oracle FI &lt; 5% · κ ≥ 0.7</text>
  <text x="332" y="584" font-size="9.5" font-style="italic" fill="#7A5E1D">tests T1–T5 pre-registered</text>

  <!-- D3: decision -->
  <rect x="600" y="495" width="280" height="110" rx="8" fill="#E9F2E7" stroke="#4F7A52" stroke-width="1.4"/>
  <text x="740" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F5231">Decision · 2026-09-18</text>
  <text x="612" y="533" font-size="10" fill="#222">standalone short paper — P2 ≥ 5%,</text>
  <text x="622" y="547" font-size="10" fill="#222">Wilson LB &gt; 1%, + one structural result</text>
  <text x="612" y="563" font-size="10" fill="#222">B1.2 FSE section (Oct 2) — strong P1 only</text>
  <text x="612" y="579" font-size="10" fill="#222">park — G2 fail → publish D0 survey alone</text>
  <text x="612" y="595" font-size="9.5" font-style="italic" fill="#2F5231">scale-up (200–300 tasks) gated, post-Oct-2</text>

  <!-- Arrows -->
  <line x1="200" y1="115" x2="217" y2="115" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="430" y1="235" x2="430" y2="252" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="320" y1="317" x2="320" y2="332" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="317" x2="560" y2="332" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="770" y1="235" x2="770" y2="332" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="160" y1="470" x2="160" y2="492" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="470" x2="304" y2="528" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="300" y1="555" x2="317" y2="555" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="580" y1="555" x2="597" y2="555" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- arrow labels -->
  <text x="446" y="247" font-size="9" fill="#777">terminal snapshot</text>
  <text x="783" y="290" font-size="9" fill="#777">constructed</text>
  <text x="783" y="301" font-size="9" fill="#777">strategies</text>

  <!-- Footer -->
  <text x="450" y="617" text-anchor="middle" font-size="9.5" fill="#777">Tier-2 contract: CPU-only truth channel · no LLM in ground truth · all rates lower bounds · P1/P2 claim discipline carried into the abstract</text>
</svg>
