  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Mining the Unwritten Rules: From Review History to Agent-Patch Violation Measurement</text>

  <!-- Panel 1: Mining -->
  <rect x="20" y="52" width="272" height="448" rx="10" fill="#eef4fb" stroke="#7fa8d0" stroke-width="1.5"/>
  <text x="156" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#24496e">1 · Review-History Mining</text>

  <rect x="36" y="92" width="240" height="90" rx="6" fill="#ffffff" stroke="#8fa6bd"/>
  <text x="46" y="110" font-size="12" font-weight="bold" fill="#24496e">M1 · Corpus collector</text>
  <text x="46" y="128" font-size="11" fill="#333">GitHub PR review threads, anchored</text>
  <text x="46" y="143" font-size="11" fill="#333">hunks, verdicts, follow-up commits</text>
  <text x="46" y="158" font-size="11" fill="#333">change-inducing flag</text>
  <text x="46" y="173" font-size="11" fill="#8a5a00">(spot-checked, n=100)</text>
  <line x1="156" y1="182" x2="156" y2="204" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="36" y="207" width="240" height="90" rx="6" fill="#ffffff" stroke="#8fa6bd"/>
  <text x="46" y="225" font-size="12" font-weight="bold" fill="#24496e">M2 · Constraint extractor</text>
  <text x="46" y="243" font-size="11" fill="#333">frozen LLM prompt &#8594; candidates</text>
  <text x="46" y="258" font-size="11" fill="#333">keyword/regex baseline in parallel</text>
  <text x="46" y="273" font-size="11" fill="#333">temporal/runtime obligations</text>
  <text x="46" y="288" font-size="11" fill="#8a5a00">&#8594; routed to trace-compliance line</text>
  <line x1="156" y1="297" x2="156" y2="319" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="36" y="322" width="240" height="122" rx="6" fill="#ffffff" stroke="#8fa6bd"/>
  <text x="46" y="340" font-size="12" font-weight="bold" fill="#24496e">M3 · Catalog builder</text>
  <text x="46" y="358" font-size="11" fill="#333">embed + cluster (HDBSCAN)</text>
  <text x="46" y="373" font-size="11" fill="#333">entailment-checked merging</text>
  <text x="46" y="388" font-size="11" fill="#333">admit: &#8805;3 threads · &#8805;2 reviewers</text>
  <text x="46" y="403" font-size="11" fill="#333">· &#8805;2 authors</text>
  <text x="46" y="418" font-size="11" fill="#333">written-status: linter-expressible</text>
  <text x="46" y="433" font-size="11" fill="#333">&#8743; doc-mentioned + tooling probe</text>

  <text x="156" y="478" text-anchor="middle" font-size="11" font-style="italic" fill="#24496e">5 SWE-bench Verified repos, window W&#8321;</text>

  <!-- arrow panel1 -> panel2 -->
  <line x1="292" y1="276" x2="314" y2="276" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>

