<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#FFFFFF"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Catching the Drift Before the Quiz — Gated Detect-and-Intervene Pipeline</text>

  <!-- ===== Stage label: offline ===== -->
  <text x="30" y="46" font-size="11" font-weight="bold" fill="#78909C">STAGE 1 · OFFLINE (no live intervention)</text>

  <!-- Row 1: telemetry -> features -> risk model -->
  <rect x="30" y="56" width="250" height="112" rx="8" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="155" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Interaction telemetry stream</text>
  <text x="155" y="94" text-anchor="middle" font-size="10.5" fill="#263238">queries · timestamps · responses</text>
  <text x="155" y="109" text-anchor="middle" font-size="10.5" fill="#263238">code-paste / error-paste events</text>
  <text x="155" y="126" text-anchor="middle" font-size="10" fill="#455A64">no model internals · no biometrics</text>
  <text x="155" y="144" text-anchor="middle" font-size="10" fill="#455A64">52 source-RCT sessions (DUA) or</text>
  <text x="155" y="158" text-anchor="middle" font-size="10" fill="#455A64">40–50 fresh sessions (fallback)</text>

  <line x1="280" y1="112" x2="313" y2="112" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="315" y="56" width="250" height="112" rx="8" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5"/>
  <text x="440" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Prefix feature extraction</text>
  <text x="440" y="94" text-anchor="middle" font-size="10.5" fill="#263238">Tier 1: deterministic log features</text>
  <text x="440" y="109" text-anchor="middle" font-size="10.5" fill="#263238">(timing, lengths, paste/error cycles)</text>
  <text x="440" y="126" text-anchor="middle" font-size="10.5" fill="#263238">Tier 2: query-intent tags, frozen</text>
  <text x="440" y="141" text-anchor="middle" font-size="10.5" fill="#263238">prompt + 15% human audit (κ ≥ 0.75)</text>
  <text x="440" y="158" text-anchor="middle" font-size="10" fill="#455A64">cumulative at k ∈ {1,3,5,10} queries</text>

  <line x1="565" y1="112" x2="598" y2="112" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="600" y="56" width="270" height="112" rx="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="735" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Landmark risk model  r_k</text>
  <text x="735" y="94" text-anchor="middle" font-size="10.5" fill="#263238">elastic-net logistic + calibration,</text>
  <text x="735" y="109" text-anchor="middle" font-size="10.5" fill="#263238">updated after every query</text>
  <text x="735" y="126" text-anchor="middle" font-size="10.5" fill="#263238">developer-disjoint nested CV,</text>
  <text x="735" y="141" text-anchor="middle" font-size="10.5" fill="#263238">cluster bootstrap (RQ1–RQ2)</text>
  <text x="735" y="158" text-anchor="middle" font-size="10" fill="#455A64">prognostic: P(erosive-terminal | prefix)</text>

  <!-- reference box: human ceiling -->
  <rect x="630" y="196" width="240" height="64" rx="8" fill="#F3E5F5" stroke="#BA68C8" stroke-width="1.5"/>
  <text x="750" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">Human prefix ceiling (RQ0)</text>
  <text x="750" y="233" text-anchor="middle" font-size="10" fill="#263238">annotators label prefixes blind to endings —</text>
  <text x="750" y="247" text-anchor="middle" font-size="10" fill="#263238">honest upper reference for the classifier</text>
  <line x1="750" y1="196" x2="746" y2="172" stroke="#8E24AA" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- arrow model -> gate -->
  <line x1="500" y1="168" x2="452" y2="224" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="500" y="196" font-size="10" fill="#455A64">freeze &amp; hash (f, c, τ, pass table)</text>

  <!-- Gate -->
  <rect x="300" y="228" width="300" height="104" rx="10" fill="#FFEBEE" stroke="#E57373" stroke-width="2"/>
  <text x="450" y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="#B71C1C">Sealed-set precision gate (RQ3)</text>
  <text x="450" y="267" text-anchor="middle" font-size="10.5" fill="#263238">≥ 20 held-out sessions, scored once at half-session</text>
  <text x="450" y="283" text-anchor="middle" font-size="10.5" fill="#263238">90% CP lower bound ≥ prevalence + 0.10</text>
  <text x="450" y="299" text-anchor="middle" font-size="10.5" fill="#263238">alerts ≥ 5 · annoyance budget ≤ 0.3</text>
  <text x="450" y="320" text-anchor="middle" font-size="10" fill="#880E4F">one preregistered re-gate allowed (delegation-only)</text>

  <!-- fail branch -->
  <rect x="40" y="242" width="220" height="78" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="150" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">Gate FAIL → still publish</text>
  <text x="150" y="281" text-anchor="middle" font-size="10" fill="#263238">"How early are erosive patterns</text>
  <text x="150" y="295" text-anchor="middle" font-size="10" fill="#263238">visible?" — ceiling + precision curves</text>
  <text x="150" y="311" text-anchor="middle" font-size="10" fill="#455A64">(CSCW note / characterization paper)</text>
  <line x1="300" y1="280" x2="262" y2="280" stroke="#90A4AE" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="281" y="272" text-anchor="middle" font-size="9.5" fill="#78909C">no-go</text>

  <!-- pass arrow -->
  <line x1="450" y1="332" x2="450" y2="368" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="466" y="354" font-size="11" font-weight="bold" fill="#2E7D32">PASS</text>

  <!-- ===== Stage 2 ===== -->
  <text x="30" y="360" font-size="11" font-weight="bold" fill="#78909C">STAGE 2 · LIVE (gate-conditional, preregistered four-arm RCT, n ≈ 120)</text>

  <!-- four arms -->
  <rect x="30" y="372" width="195" height="92" rx="8" fill="#EFEBE9" stroke="#A1887F" stroke-width="1.5"/>
  <text x="127" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#4E342E">H · Hand-code</text>
  <text x="127" y="410" text-anchor="middle" font-size="10" fill="#263238">no AI assistance</text>
  <text x="127" y="426" text-anchor="middle" font-size="10" fill="#455A64">replication anchor for the</text>
  <text x="127" y="440" text-anchor="middle" font-size="10" fill="#455A64">published 67% baseline</text>

  <rect x="245" y="372" width="195" height="92" rx="8" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="342" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579B">U · Unnotified AI</text>
  <text x="342" y="410" text-anchor="middle" font-size="10" fill="#263238">assistant unchanged;</text>
  <text x="342" y="424" text-anchor="middle" font-size="10" fill="#263238">classifier runs silently</text>
  <text x="342" y="440" text-anchor="middle" font-size="10" fill="#455A64">replicates the 50% AI arm</text>

  <rect x="460" y="372" width="195" height="92" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.5"/>
  <text x="557" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">P · Placebo trigger</text>
  <text x="557" y="410" text-anchor="middle" font-size="10" fill="#263238">same trigger policy; neutral</text>
  <text x="557" y="424" text-anchor="middle" font-size="10" fill="#263238">message matched in timing,</text>
  <text x="557" y="438" text-anchor="middle" font-size="10" fill="#263238">length, presentation</text>
  <text x="557" y="456" text-anchor="middle" font-size="9.5" fill="#455A64">isolates notification reactivity</text>

  <rect x="675" y="372" width="195" height="92" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.8"/>
  <text x="772" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">N · Active nudge</text>
  <text x="772" y="410" text-anchor="middle" font-size="10" fill="#263238">first r_k ≥ c crossing (k ≥ 3):</text>
  <text x="772" y="424" text-anchor="middle" font-size="10" fill="#263238">full answer + comprehension</text>
  <text x="772" y="438" text-anchor="middle" font-size="10" fill="#263238">question — additive, one-shot</text>
  <text x="772" y="456" text-anchor="middle" font-size="9.5" fill="#455A64">template bank + integrity audit</text>

  <!-- arrows arms -> probe -->
  <line x1="127" y1="464" x2="127" y2="496" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="342" y1="464" x2="342" y2="496" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="557" y1="464" x2="557" y2="496" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="772" y1="464" x2="772" y2="496" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- skill probe -->
  <rect x="30" y="498" width="840" height="66" rx="8" fill="#E0F7FA" stroke="#4DD0E1" stroke-width="1.5"/>
  <text x="450" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#006064">Later skill probe — original-rubric quiz, two arm-blinded graders (κ reported)</text>
  <text x="450" y="537" text-anchor="middle" font-size="10.5" fill="#263238">Δrep = U − H (internal replication, interpretation tree) · Δcontent = N − P (primary) · Δreact = P − U · detection-lag distribution</text>
  <text x="450" y="554" text-anchor="middle" font-size="10" fill="#455A64">guardrails: task completion &amp; time-on-task in N within 10% of U · six-way patterns descriptive only</text>

  <!-- bottom band: IRB / prereg gates -->
  <rect x="30" y="578" width="840" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
  <text x="450" y="598" text-anchor="middle" font-size="10.5" fill="#37474F">Parallel gates:  IRB-1 transcript protocol (wk 1) → IRB-2 live-RCT protocol (Nov 2026) → freeze-and-hash + OSF prereg before first participant → pilot Feb–May 2027 → scale-up gate G2</text>
</svg>
