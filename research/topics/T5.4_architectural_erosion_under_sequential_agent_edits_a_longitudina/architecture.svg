<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#455a64"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1565c0"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#fcfcfe"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#212121">

    <!-- ============ Top band: task stream ============ -->
    <rect x="25" y="15" width="545" height="70" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.3"/>
    <text x="40" y="34" font-size="13" font-weight="bold">Chronological task stream (per repository)</text>
    <g font-size="12">
      <rect x="40" y="46" width="40" height="24" rx="4" fill="#ffffff" stroke="#78909c"/>
      <text x="53" y="62">q1</text>
      <line x1="80" y1="58" x2="96" y2="58" stroke="#455a64" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="98" y="46" width="40" height="24" rx="4" fill="#ffffff" stroke="#78909c"/>
      <text x="111" y="62">q2</text>
      <line x1="138" y1="58" x2="154" y2="58" stroke="#455a64" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="156" y="46" width="40" height="24" rx="4" fill="#ffffff" stroke="#78909c"/>
      <text x="169" y="62">q3</text>
      <line x1="196" y1="58" x2="212" y2="58" stroke="#455a64" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="214" y="46" width="40" height="24" rx="4" fill="#ffffff" stroke="#78909c"/>
      <text x="227" y="62">q4</text>
      <text x="262" y="62" font-size="14">&#8230;</text>
      <rect x="284" y="46" width="40" height="24" rx="4" fill="#ffffff" stroke="#78909c"/>
      <text x="295" y="62">qT</text>
    </g>
    <text x="340" y="55" font-size="11" fill="#37474f">~20 issue-derived tasks per repo</text>
    <text x="340" y="70" font-size="11" fill="#37474f">(SWE-bench Verified, by issue date)</text>

    <!-- Test gate -->
    <rect x="590" y="15" width="285" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.3"/>
    <text x="605" y="34" font-size="13" font-weight="bold">Architecture-blind test gate G</text>
    <text x="605" y="52" font-size="11.5">rebased fail-to-pass + regression tests only</text>
    <text x="605" y="68" font-size="11.5">&#8804; k retries (logged) &#183; no structure checks</text>

    <!-- stream -> arms arrow; gate -> arms dashed -->
    <line x1="297" y1="85" x2="297" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="85" x2="500" y2="110" stroke="#f9a825" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="505" y="101" font-size="11" fill="#8d6e63">gates every arm</text>

    <!-- ============ Arms container ============ -->
    <rect x="25" y="112" width="550" height="228" rx="6" fill="none" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="35" y="128" font-size="12" font-style="italic" fill="#546e7a">Three synchronized arms &#8212; identical task exposure, symmetric attrition</text>

    <!-- Lane H -->
    <rect x="35" y="136" width="530" height="52" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="45" y="152" font-size="13" font-weight="bold" fill="#1b5e20">Human-gold (H) &#8212; historical patches</text>
    <g font-size="11.5">
      <rect x="45" y="158" width="34" height="20" rx="3" fill="#ffffff" stroke="#2e7d32"/>
      <text x="53" y="172">H0</text>
      <line x1="79" y1="168" x2="103" y2="168" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="105" y="158" width="34" height="20" rx="3" fill="#ffffff" stroke="#2e7d32"/>
      <text x="113" y="172">H1</text>
      <line x1="139" y1="168" x2="163" y2="168" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="165" y="158" width="34" height="20" rx="3" fill="#ffffff" stroke="#2e7d32"/>
      <text x="173" y="172">H2</text>
      <line x1="199" y1="168" x2="223" y2="168" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="225" y="158" width="34" height="20" rx="3" fill="#ffffff" stroke="#2e7d32"/>
      <text x="233" y="172">H3</text>
      <text x="266" y="172" font-size="13">&#8230;</text>
    </g>
    <text x="300" y="172" font-size="11" fill="#33691e">state propagates along real history</text>

    <!-- Lane S -->
    <rect x="35" y="206" width="530" height="54" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
    <text x="45" y="222" font-size="13" font-weight="bold" fill="#0d47a1">Single-shot (S) &#8212; agent edits matched human parent</text>
    <g font-size="11.5">
      <rect x="105" y="230" width="34" height="20" rx="3" fill="#ffffff" stroke="#1565c0"/>
      <text x="114" y="244">S1</text>
      <rect x="165" y="230" width="34" height="20" rx="3" fill="#ffffff" stroke="#1565c0"/>
      <text x="174" y="244">S2</text>
      <rect x="225" y="230" width="34" height="20" rx="3" fill="#ffffff" stroke="#1565c0"/>
      <text x="234" y="244">S3</text>
      <text x="266" y="244" font-size="13">&#8230;</text>
    </g>
    <text x="300" y="244" font-size="11" fill="#0d47a1">no state propagation (isolated patches)</text>
    <!-- parent arrows H_{t-1} -> S_t -->
    <line x1="62" y1="190" x2="115" y2="228" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
    <line x1="122" y1="190" x2="175" y2="228" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
    <line x1="182" y1="190" x2="235" y2="228" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
    <text x="80" y="203" font-size="10.5" fill="#1565c0">parent = H(t&#8722;1)</text>

    <!-- Lane A -->
    <rect x="35" y="272" width="530" height="60" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
    <text x="45" y="288" font-size="13" font-weight="bold" fill="#bf360c">Agent-serial (A) &#8212; agent edits its own last accepted state</text>
    <g font-size="11.5">
      <rect x="45" y="296" width="34" height="20" rx="3" fill="#ffffff" stroke="#e65100"/>
      <text x="53" y="310">A0</text>
      <line x1="79" y1="306" x2="103" y2="306" stroke="#e65100" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="105" y="296" width="34" height="20" rx="3" fill="#ffffff" stroke="#e65100"/>
      <text x="113" y="310">A1</text>
      <line x1="139" y1="306" x2="163" y2="306" stroke="#e65100" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="165" y="296" width="34" height="20" rx="3" fill="#ffffff" stroke="#e65100"/>
      <text x="173" y="310">A2</text>
      <line x1="199" y1="306" x2="223" y2="306" stroke="#e65100" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="225" y="296" width="34" height="20" rx="3" fill="#ffffff" stroke="#e65100"/>
      <text x="233" y="310">A3</text>
      <text x="266" y="310" font-size="13">&#8230;</text>
    </g>
    <text x="300" y="303" font-size="11" fill="#bf360c">inherits its own prior edits (accumulation);</text>
    <text x="300" y="317" font-size="11" fill="#bf360c">carry-forward on failure</text>

    <!-- ============ Right column ============ -->
    <rect x="590" y="112" width="285" height="108" rx="6" fill="#f5f5f5" stroke="#78909c" stroke-width="1.2"/>
    <text x="605" y="131" font-size="13" font-weight="bold">Symmetric protocol</text>
    <text x="605" y="149" font-size="11">deterministic rebase &#183; identical task exposure</text>
    <text x="605" y="165" font-size="11">gold conflicts &#8594; task dropped from all arms</text>
    <text x="605" y="181" font-size="11">differential attrition &gt; 15pp voids the repo</text>
    <text x="605" y="197" font-size="11">retry count logged as model covariate</text>
    <text x="605" y="213" font-size="11">pinned models, seeds &#183; joint-only censoring</text>

    <rect x="590" y="232" width="285" height="108" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
    <text x="605" y="251" font-size="13" font-weight="bold" fill="#b71c1c">Go / no-go pilot gate</text>
    <text x="605" y="269" font-size="11">pilot: django &#215; 1 config &#215; 3 seeds (~60 runs)</text>
    <text x="605" y="285" font-size="11">G1 rebase survival &#8805; 60%, diff-attrition &#8804; 15pp</text>
    <text x="605" y="301" font-size="11">G2 power check &#183; G3 acceptance rate &#8805; 40%</text>
    <text x="605" y="317" font-size="11">pass &#8594; 3 repos &#215; 3 configs &#215; 2 ord &#215; 3 seeds</text>
    <text x="605" y="333" font-size="11">fail G1 &#8594; synthetic-sequence fallback</text>
    <line x1="590" y1="286" x2="578" y2="286" stroke="#c62828" stroke-width="1.3" marker-end="url(#arrR)"/>

    <!-- arms -> metrics arrows -->
    <line x1="150" y1="340" x2="150" y2="352" stroke="#455a64" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="300" y1="340" x2="300" y2="352" stroke="#455a64" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="450" y1="340" x2="450" y2="352" stroke="#455a64" stroke-width="1.4" marker-end="url(#arr)"/>

    <!-- ============ Metrics layer ============ -->
    <rect x="25" y="354" width="850" height="100" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.3"/>
    <text x="40" y="373" font-size="13" font-weight="bold" fill="#4a148c">Erosion metrics layer &#8212; measured after acceptance, never influences the gate</text>
    <rect x="40" y="382" width="245" height="62" rx="5" fill="#ffffff" stroke="#8e24aa"/>
    <text x="52" y="399" font-size="12" font-weight="bold">Per-patch &#916; (mechanism)</text>
    <text x="52" y="416" font-size="11">&#948;t = z(post) &#8722; z(parent)</text>
    <text x="52" y="432" font-size="11">patch features &#183; retries &#183; edit locality</text>
    <rect x="305" y="382" width="245" height="62" rx="5" fill="#ffffff" stroke="#8e24aa"/>
    <text x="317" y="399" font-size="12" font-weight="bold">Accumulated trajectory</text>
    <text x="317" y="416" font-size="11">Yt = z(x0) + &#931; &#948;</text>
    <text x="317" y="432" font-size="11">slopes &#183; time-to-first-new-violation</text>
    <rect x="570" y="382" width="290" height="62" rx="5" fill="#ffffff" stroke="#8e24aa" stroke-width="1.6"/>
    <text x="582" y="399" font-size="12" font-weight="bold">T5.2 detector pairing (frozen instrument)</text>
    <text x="582" y="416" font-size="11">validated layering-violation detector; fixed layer</text>
    <text x="582" y="432" font-size="11">manifest &#183; pinned env &#183; KLOC-normalized primary</text>

    <!-- metrics -> analysis arrow -->
    <line x1="297" y1="454" x2="297" y2="470" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ============ Analysis band ============ -->
    <rect x="25" y="472" width="545" height="128" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
    <text x="40" y="491" font-size="13" font-weight="bold">Longitudinal analysis &amp; decomposition</text>
    <text x="40" y="510" font-size="11.5">NB GLMM: violations ~ arm &#215; step + retries &#183; repo random slopes &#183; AR(1)</text>
    <text x="40" y="527" font-size="11.5">discrete-time survival (shared frailty) &#183; restricted mean time to 1st violation</text>
    <text x="40" y="544" font-size="11.5" font-weight="bold">&#952;(A:H) = Q (per-patch, S&#8722;H) + C (accumulation, A&#8722;S)</text>
    <text x="40" y="561" font-size="11.5">mechanism: per-step &#948; ~ features + retries + lagged state + ordering + config</text>
    <text x="40" y="578" font-size="11.5">TOST equivalence margins &#948;L (slope), &#948;T (survival horizon)</text>

    <line x1="570" y1="536" x2="588" y2="536" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="590" y="472" width="285" height="128" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.3"/>
    <text x="605" y="491" font-size="13" font-weight="bold" fill="#1a237e">Pre-registered adjudication</text>
    <rect x="605" y="500" width="255" height="20" rx="4" fill="#ffffff" stroke="#c62828"/>
    <text x="613" y="514" font-size="11.5">Erosion &#8212; agent drifts faster than human</text>
    <rect x="605" y="524" width="255" height="20" rx="4" fill="#ffffff" stroke="#546e7a"/>
    <text x="613" y="538" font-size="11.5">Parity &#8212; within equivalence margins</text>
    <rect x="605" y="548" width="255" height="20" rx="4" fill="#ffffff" stroke="#2e7d32"/>
    <text x="613" y="562" font-size="11.5">Conservatism &#8212; agent under-refactors</text>
    <text x="605" y="586" font-size="11" font-style="italic" fill="#37474f">all publishable &#183; discordant &#8594; failed adjudication</text>
  </g>
</svg>
