  <rect x="316" y="52" width="272" height="448" rx="10" fill="#fdf6e7" stroke="#d8b45e" stroke-width="1.5"/>
  <text x="452" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10">2 · Constraint Cards + Validation</text>

  <rect x="332" y="92" width="240" height="150" rx="6" fill="#ffffff" stroke="#c2a35a"/>
  <text x="342" y="110" font-size="12" font-weight="bold" fill="#7a5a10">Constraint card (versioned)</text>
  <text x="342" y="128" font-size="10.5" font-family="monospace" fill="#333">statement · scope · trigger</text>
  <text x="342" y="143" font-size="10.5" font-family="monospace" fill="#333">category: EH | arch | API | other</text>
  <text x="342" y="158" font-size="10.5" font-family="monospace" fill="#333">checkability + check_hint</text>
  <text x="342" y="173" font-size="10.5" font-family="monospace" fill="#333">support + evidence links</text>
  <text x="342" y="188" font-size="10.5" font-family="monospace" fill="#333">written_status · examples</text>
  <text x="342" y="203" font-size="10.5" font-family="monospace" fill="#333">human_verified flag</text>
  <text x="342" y="224" font-size="11" font-style="italic" fill="#7a5a10">per-repo catalog + quarantine tier</text>
  <line x1="452" y1="242" x2="452" y2="264" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="332" y="267" width="240" height="150" rx="6" fill="#ffffff" stroke="#c2a35a"/>
  <text x="342" y="285" font-size="12" font-weight="bold" fill="#7a5a10">Validation instruments (human-anchored)</text>
  <text x="342" y="303" font-size="11" fill="#333">precision audit n=300, dual, &#954;</text>
  <text x="342" y="318" font-size="11" fill="#333">cluster purity n=150 pairs</text>
  <text x="342" y="333" font-size="11" fill="#333">recall proxy: held-out threads</text>
  <text x="342" y="348" font-size="11" fill="#333">LLM vs keyword baseline (McNemar)</text>
  <text x="342" y="363" font-size="11" fill="#333">judge &#954; &#8805; 0.6 per category</text>
  <text x="342" y="381" font-size="11" fill="#8a5a00">blinding integrity &#8804; 0.60 bal. acc.</text>
  <text x="342" y="399" font-size="11" fill="#8a5a00">all disagreement data released</text>

  <rect x="332" y="432" width="240" height="52" rx="6" fill="#fbeecb" stroke="#c99b3f"/>
  <text x="342" y="450" font-size="11.5" font-weight="bold" fill="#7a5a10">Artifact &#8594; T5.3 checker evaluation</text>
  <text x="342" y="466" font-size="11" fill="#333">schema smoke test: reference semgrep</text>
  <text x="342" y="479" font-size="11" fill="#333">runner executes every released card</text>
  <line x1="452" y1="417" x2="452" y2="430" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrow panel2 -> panel3 -->
  <line x1="588" y1="276" x2="610" y2="276" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Panel 3: Violation study -->
  <rect x="612" y="52" width="272" height="448" rx="10" fill="#edf7ee" stroke="#7fbb85" stroke-width="1.5"/>
  <text x="748" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#25603a">3 · Green-Test Patch Evaluation</text>

  <rect x="628" y="92" width="240" height="92" rx="6" fill="#ffffff" stroke="#84a98c"/>
  <text x="638" y="110" font-size="12" font-weight="bold" fill="#25603a">Patch harness (SWE-bench Verified)</text>
  <text x="638" y="128" font-size="11" fill="#333">agent patches: &#8805;3 systems, 300&#8211;500</text>
  <text x="638" y="143" font-size="11" fill="#333">matched human gold, same tasks</text>
  <text x="638" y="158" font-size="11" fill="#333">all verified green &#8212; every violation</text>
  <text x="638" y="173" font-size="11" fill="#8a5a00">is invisible to the test oracle</text>
  <line x1="748" y1="184" x2="748" y2="206" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="628" y="209" width="240" height="106" rx="6" fill="#ffffff" stroke="#84a98c"/>
  <text x="638" y="227" font-size="12" font-weight="bold" fill="#25603a">Tiered adjudication</text>
  <text x="638" y="245" font-size="11" fill="#333">mechanical/static rules + unit tests</text>
  <text x="638" y="260" font-size="11" fill="#333">LLM judge (gated, other model family)</text>
  <text x="638" y="275" font-size="11" fill="#333">human-only subsample</text>
  <text x="638" y="290" font-size="11" fill="#333">applicability-normalized rates;</text>
  <text x="638" y="305" font-size="11" fill="#333">every label carries its tier</text>
  <line x1="748" y1="315" x2="748" y2="337" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="628" y="340" width="240" height="104" rx="6" fill="#ffffff" stroke="#84a98c"/>
  <text x="638" y="358" font-size="12" font-weight="bold" fill="#25603a">Findings</text>
  <text x="638" y="376" font-size="11" fill="#333">tests pass &#8743; norms violated:</text>
  <text x="638" y="391" font-size="11" fill="#333">agent vs human, per category</text>
  <text x="638" y="406" font-size="11" fill="#333">(matched McNemar, Holm&#8211;Bonf.)</text>
  <text x="638" y="421" font-size="11" fill="#333">outcome linkage: mechanical tier on</text>
  <text x="638" y="436" font-size="11" fill="#333">held-out human PRs (window W&#8322;)</text>

  <text x="748" y="478" text-anchor="middle" font-size="11" font-style="italic" fill="#25603a">unwrittenness rate = headline claim</text>

