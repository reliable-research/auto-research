<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#16232f">Two-Regime Mechanism Attribution of Soft/Hard Constraint Decay</text>

  <!-- ===== Stage A: Constraint bank ===== -->
  <rect x="20" y="52" width="290" height="120" rx="8" fill="#eaf2fb" stroke="#3d6fa8" stroke-width="1.6"/>
  <text x="165" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c3a5a">A. Matched Constraint Bank</text>
  <text x="34" y="94" font-size="11.5" fill="#243545">Soft / hard pairs equated for length,</text>
  <text x="34" y="109" font-size="11.5" fill="#243545">specificity, difficulty, opportunity count</text>
  <text x="34" y="127" font-size="11.5" fill="#243545">&#8226; hard = high no-injection compliance</text>
  <text x="34" y="142" font-size="11.5" fill="#243545">&#8226; soft = near-zero no-injection compliance</text>
  <text x="34" y="157" font-size="11.5" fill="#243545">&#8226; deterministic rule-checkable predicates</text>

  <!-- Arms -->
  <rect x="20" y="186" width="88" height="52" rx="6" fill="#f3f7fc" stroke="#3d6fa8" stroke-width="1.2"/>
  <text x="64" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c3a5a">Injected</text>
  <text x="64" y="222" text-anchor="middle" font-size="10" fill="#42566a">full instruction</text>
  <rect x="121" y="186" width="88" height="52" rx="6" fill="#f3f7fc" stroke="#3d6fa8" stroke-width="1.2"/>
  <text x="165" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c3a5a">Cue-only null</text>
  <text x="165" y="222" text-anchor="middle" font-size="10" fill="#42566a">class token only</text>
  <rect x="222" y="186" width="88" height="52" rx="6" fill="#f3f7fc" stroke="#3d6fa8" stroke-width="1.2"/>
  <text x="266" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c3a5a">No-injection</text>
  <text x="266" y="222" text-anchor="middle" font-size="10" fill="#42566a">cue-free floor</text>
  <line x1="165" y1="172" x2="165" y2="186" stroke="#3a4a5a" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Arrow bank -> treatments -->
  <line x1="310" y1="112" x2="348" y2="112" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Stage B: Treatments ===== -->
  <rect x="348" y="52" width="290" height="82" rx="8" fill="#eefaf0" stroke="#3f8f5a" stroke-width="1.6"/>
  <text x="493" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e4f30">B1. Regime G — Growth only</text>
  <text x="362" y="93" font-size="11.5" fill="#244632">Turns accumulate, constraint stays verbatim;</text>
  <text x="362" y="108" font-size="11.5" fill="#244632">salience factors: position &#215; repetition;</text>
  <text x="362" y="123" font-size="11.5" fill="#244632">framing: advisory vs imperative wording</text>

  <rect x="348" y="150" width="290" height="128" rx="8" fill="#eefaf0" stroke="#3f8f5a" stroke-width="1.6"/>
  <text x="493" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e4f30">B2. Regime C — Compaction replay</text>
  <text x="362" y="191" font-size="11.5" fill="#244632">Same frozen histories, operator varies:</text>
  <text x="362" y="207" font-size="11.5" fill="#244632">&#8226; keep-top truncation &#8226; summarize</text>
  <text x="362" y="223" font-size="11.5" fill="#244632">&#8226; summarize + verbatim pin (mitigation)</text>
  <text x="362" y="239" font-size="11.5" fill="#244632">&#8226; deletion &#8594; natural experiment vs</text>
  <text x="372" y="255" font-size="11.5" fill="#244632">no-injection floor (prior signature)</text>
  <text x="362" y="271" font-size="10.5" fill="#4a6a55" font-style="italic">equal token budget; textual survival logged</text>

  <line x1="493" y1="134" x2="493" y2="150" stroke="#3a4a5a" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Arrow treatments -> probes -->
  <line x1="493" y1="278" x2="493" y2="300" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Stage C: Probes ===== -->
  <rect x="348" y="300" width="290" height="92" rx="8" fill="#fdf6e7" stroke="#b8862e" stroke-width="1.6"/>
  <text x="493" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a4a10">C. Retention Probes</text>
  <text x="362" y="341" font-size="11.5" fill="#5a451e">Scheduled probes over long horizon (30&#8211;100</text>
  <text x="362" y="356" font-size="11.5" fill="#5a451e">turns); anti-reactivity wording; reactivity bound</text>
  <text x="362" y="371" font-size="11.5" fill="#5a451e">measured first. Frozen rule-based parsers only</text>
  <text x="362" y="386" font-size="11.5" fill="#5a451e">(no LLM judge in headline metric).</text>

  <!-- Arrow probes -> decomposition -->
  <line x1="638" y1="346" x2="672" y2="346" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Arrow B arms feed right column too -->
  <line x1="638" y1="93" x2="672" y2="93" stroke="#3a4a5a" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ===== Stage D: Mechanism decomposition ===== -->
  <rect x="672" y="52" width="208" height="60" rx="7" fill="#f4eefb" stroke="#7a4fa8" stroke-width="1.5"/>
  <text x="776" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a2a70">Salience</text>
  <text x="776" y="88" text-anchor="middle" font-size="10.5" fill="#503a68">position + repetition slopes;</text>
  <text x="776" y="102" text-anchor="middle" font-size="10.5" fill="#503a68">text survival through operator</text>

  <rect x="672" y="124" width="208" height="60" rx="7" fill="#f4eefb" stroke="#7a4fa8" stroke-width="1.5"/>
  <text x="776" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a2a70">Framing</text>
  <text x="776" y="160" text-anchor="middle" font-size="10.5" fill="#503a68">advisory vs imperative contrast</text>
  <text x="776" y="174" text-anchor="middle" font-size="10.5" fill="#503a68">at fixed salience</text>

  <rect x="672" y="196" width="208" height="76" rx="7" fill="#f4eefb" stroke="#7a4fa8" stroke-width="1.5"/>
  <text x="776" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a2a70">Alignment prior</text>
  <text x="776" y="232" text-anchor="middle" font-size="10.5" fill="#503a68">no-injection compliance floor;</text>
  <text x="776" y="246" text-anchor="middle" font-size="10.5" fill="#503a68">base vs instruct twin delta;</text>
  <text x="776" y="260" text-anchor="middle" font-size="10.5" fill="#503a68">deletion natural experiment</text>

  <line x1="776" y1="272" x2="776" y2="300" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="672" y="300" width="208" height="92" rx="8" fill="#fbeeee" stroke="#b04a4a" stroke-width="1.6"/>
  <text x="776" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a2a">D. Attribution</text>
  <text x="686" y="341" font-size="11" fill="#6a3535">Mixed-effects hazard / trajectory</text>
  <text x="686" y="356" font-size="11" fill="#6a3535">models; G_raw = G_null + G_lift;</text>
  <text x="686" y="371" font-size="11" fill="#6a3535">dominance shares per mechanism +</text>
  <text x="686" y="386" font-size="11" fill="#6a3535">explicit unresolved / residual states</text>

  <!-- ===== Bottom: pilot gates ===== -->
  <rect x="20" y="428" width="860" height="170" rx="10" fill="#f5f7f9" stroke="#8fa3b5" stroke-width="1.4"/>
  <text x="450" y="452" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#25303a">Staged execution with preregistered go / no-go gates (budget: &#8804; $3k API + &#8804; 10 A100-days)</text>

  <rect x="40" y="468" width="190" height="76" rx="7" fill="#ffffff" stroke="#5a7a96" stroke-width="1.3"/>
  <text x="135" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#25405a">G0 &#183; Week 1</text>
  <text x="135" y="503" text-anchor="middle" font-size="10.5" fill="#3a4c5c">source + precedent search;</text>
  <text x="135" y="517" text-anchor="middle" font-size="10.5" fill="#3a4c5c">verifier audit &#954; &#8805; 0.8;</text>
  <text x="135" y="531" text-anchor="middle" font-size="10.5" fill="#3a4c5c">5-pair smoke run</text>

  <rect x="255" y="468" width="190" height="76" rx="7" fill="#ffffff" stroke="#5a7a96" stroke-width="1.3"/>
  <text x="350" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#25405a">G1 &#183; Reactivity</text>
  <text x="350" y="503" text-anchor="middle" font-size="10.5" fill="#3a4c5c">within vs between probing;</text>
  <text x="350" y="517" text-anchor="middle" font-size="10.5" fill="#3a4c5c">type-uniform &#8594; proceed,</text>
  <text x="350" y="531" text-anchor="middle" font-size="10.5" fill="#3a4c5c">else escalate design</text>

  <rect x="470" y="468" width="190" height="76" rx="7" fill="#ffffff" stroke="#5a7a96" stroke-width="1.3"/>
  <text x="565" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#25405a">G2 &#183; Gap replication</text>
  <text x="565" y="503" text-anchor="middle" font-size="10.5" fill="#3a4c5c">pilot: soft decays faster,</text>
  <text x="565" y="517" text-anchor="middle" font-size="10.5" fill="#3a4c5c">directionally; fail &#8594; pivot to</text>
  <text x="565" y="531" text-anchor="middle" font-size="10.5" fill="#3a4c5c">null-replication paper</text>

  <rect x="685" y="468" width="190" height="76" rx="7" fill="#ffffff" stroke="#5a7a96" stroke-width="1.3"/>
  <text x="780" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#25405a">G3 &#183; Stability</text>
  <text x="780" y="503" text-anchor="middle" font-size="10.5" fill="#3a4c5c">attribution stable under refit</text>
  <text x="780" y="517" text-anchor="middle" font-size="10.5" fill="#3a4c5c">+ leave-one-pair-out;</text>
  <text x="780" y="531" text-anchor="middle" font-size="10.5" fill="#3a4c5c">then scale-up (3 models)</text>

  <line x1="230" y1="506" x2="255" y2="506" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="445" y1="506" x2="470" y2="506" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="660" y1="506" x2="685" y2="506" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="450" y="572" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5a68">All calipers, gates, and analysis code frozen before scale-up; every cell reported, including unresolved states.</text>
</svg>
