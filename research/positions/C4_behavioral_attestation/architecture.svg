<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Behavioral Attestation under an Adaptive Provider: the Detection–Spoofing Cost Frontier</text>

  <!-- ===== Left: substitution / ground-truth testbed ===== -->
  <rect x="18" y="52" width="256" height="250" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="146" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Ground-truth testbed (we control)</text>
  <text x="146" y="92" text-anchor="middle" font-size="11" fill="#475569">Endpoints serve known checkpoint pairs</text>

  <rect x="36" y="104" width="220" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="48" y="119" font-size="12.5" font-weight="bold" fill="#14532d">m0</text>
  <text x="76" y="119" font-size="11.5" fill="#14532d">reference checkpoint</text>
  <text x="48" y="132" font-size="9.5" fill="#166534">the genuine model</text>

  <rect x="36" y="146" width="220" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="48" y="161" font-size="12.5" font-weight="bold" fill="#7f1d1d">m0*</text>
  <text x="84" y="161" font-size="11.5" fill="#7f1d1d">tier-downgrade sibling (R2)</text>
  <text x="48" y="174" font-size="9.5" fill="#991b1b">quantized / distilled — hard consumer case</text>

  <rect x="36" y="188" width="220" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="48" y="207" font-size="12.5" font-weight="bold" fill="#78350f">m1</text>
  <text x="76" y="207" font-size="11.5" fill="#78350f">cross-family substitute (R1)</text>

  <rect x="36" y="228" width="220" height="58" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="146" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">Calibrated serving noise N</text>
  <text x="146" y="261" text-anchor="middle" font-size="9.5" fill="#3730a3">temperature · batching · quantization · routing</text>
  <text x="146" y="275" text-anchor="middle" font-size="9.5" fill="#3730a3">gate G1: fit to measured real-API variance</text>

  <!-- ===== Middle: auditor / detector bank ===== -->
  <rect x="322" y="52" width="256" height="250" rx="9" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="450" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">External black-box auditor</text>
  <text x="450" y="92" text-anchor="middle" font-size="11" fill="#0369a1">only prompts in, text out — no internals</text>

  <rect x="340" y="104" width="220" height="30" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="450" y="123" text-anchor="middle" font-size="11" fill="#0c4a6e">Sequential info-gain query selection (SLRT)</text>

  <text x="450" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0c4a6e">Detector bank (G2: reproduce source papers)</text>
  <rect x="340" y="160" width="106" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="393" y="179" text-anchor="middle" font-size="10.5" fill="#0c4a6e">rank-based (RUT)</text>
  <rect x="454" y="160" width="106" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="507" y="179" text-anchor="middle" font-size="10.5" fill="#0c4a6e">one-token</text>
  <rect x="340" y="196" width="106" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="393" y="215" text-anchor="middle" font-size="10.5" fill="#0c4a6e">logprob track</text>
  <rect x="454" y="196" width="106" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="507" y="215" text-anchor="middle" font-size="10.5" fill="#0c4a6e">MMD equality</text>

  <rect x="340" y="234" width="220" height="52" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="450" y="252" text-anchor="middle" font-size="10.5" fill="#0c4a6e">Decision A(T) ∈ {genuine, substituted}</text>
  <text x="450" y="267" text-anchor="middle" font-size="10.5" fill="#0369a1">power D at FPR α, query cost n</text>
  <text x="450" y="280" text-anchor="middle" font-size="9.5" fill="#0369a1">audit budget b</text>

  <!-- ===== Right: adversary / spoofing ladder ===== -->
  <rect x="626" y="52" width="256" height="250" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="754" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Spoofing-aware provider</text>
  <text x="754" y="92" text-anchor="middle" font-size="10" fill="#991b1b">Kerckhoffs: knows detector class, pays budget h</text>

  <rect x="644" y="104" width="220" height="26" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="754" y="121" text-anchor="middle" font-size="10.5" fill="#7f1d1d">A0 none · A1 naive output-matching</text>
  <rect x="644" y="134" width="220" height="26" rx="5" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="754" y="151" text-anchor="middle" font-size="10.5" fill="#7f1d1d">A2 detector-aware distributional match</text>
  <rect x="644" y="164" width="220" height="26" rx="5" fill="#fecaca" stroke="#b91c1c"/>
  <text x="754" y="181" text-anchor="middle" font-size="10.5" fill="#7f1d1d">A3 best-response (bounded post-processing)</text>
  <rect x="644" y="194" width="220" height="26" rx="5" fill="#fca5a5" stroke="#991b1b" stroke-dasharray="4 2"/>
  <text x="754" y="211" text-anchor="middle" font-size="10.5" fill="#7f1d1d">A4 PEFT fine-tune  (upper tier)</text>

  <rect x="644" y="228" width="220" height="58" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="754" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Cost-of-hiding ledger</text>
  <text x="754" y="261" text-anchor="middle" font-size="9.5" fill="#991b1b">compute · latency · energy · capacity → $</text>
  <text x="754" y="276" text-anchor="middle" font-size="10" fill="#991b1b">erosion E = (C_M − C_D)/(C_T − C_D)</text>

  <!-- flows between top boxes -->
  <line x1="274" y1="152" x2="322" y2="152" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="298" y="145" text-anchor="middle" font-size="9" fill="#334155">queries</text>
  <line x1="578" y1="170" x2="626" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="626" y1="148" x2="578" y2="148" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="602" y="141" text-anchor="middle" font-size="9" fill="#b91c1c">mimic m0</text>
  <text x="602" y="184" text-anchor="middle" font-size="9" fill="#334155">probe m0*/m1</text>

  <!-- double-oracle note -->
  <text x="450" y="322" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">Double-oracle game: auditor and provider alternate held-out best responses under a shared budget ledger</text>

  <!-- ===== Bottom-left: frontier plot ===== -->
  <rect x="18" y="338" width="420" height="262" rx="9" fill="#fafafa" stroke="#64748b" stroke-width="1.5"/>
  <text x="228" y="360" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Detection-vs-spoofing cost frontier (headline)</text>
  <text x="228" y="376" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">R2 (consumer case) is cheaper to spoof than R1 — the asymmetry hypothesis</text>
  <!-- axes -->
  <line x1="72" y1="562" x2="412" y2="562" stroke="#334155" stroke-width="1.4"/>
  <line x1="72" y1="562" x2="72" y2="386" stroke="#334155" stroke-width="1.4"/>
  <text x="242" y="586" text-anchor="middle" font-size="11" fill="#334155">adversary mimicry budget  h  →</text>
  <text x="42" y="474" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-90 42 474)">detection power D</text>
  <!-- gridline for practical threshold -->
  <line x1="72" y1="458" x2="412" y2="458" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="406" y="453" text-anchor="end" font-size="9" fill="#64748b">D=0.8 audit threshold</text>
  <!-- R1 curve: graceful -->
  <path d="M72,398 C160,404 260,421 412,458" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="330" y="432" font-size="10" fill="#b45309" font-weight="bold">R1 substitution</text>
  <!-- R2 curve: cost cliff -->
  <path d="M72,404 C112,411 130,522 182,542 C242,554 342,558 412,560" fill="none" stroke="#b91c1c" stroke-width="2.6"/>
  <text x="250" y="536" font-size="10" fill="#b91c1c" font-weight="bold">R2 downgrade</text>
  <!-- cliff annotation -->
  <circle cx="142" cy="476" r="4" fill="#b91c1c"/>
  <text x="152" y="480" font-size="9.5" fill="#7f1d1d">cost cliff: small h collapses D</text>

  <!-- ===== Bottom-right: decision map + gates ===== -->
  <rect x="454" y="338" width="428" height="262" rx="9" fill="#fafafa" stroke="#64748b" stroke-width="1.5"/>
  <text x="668" y="360" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Decision map &amp; implication (argued)</text>
  <!-- map plane -->
  <rect x="512" y="374" width="250" height="150" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="637" y="540" text-anchor="middle" font-size="10.5" fill="#334155">serving noise N  →</text>
  <text x="492" y="449" text-anchor="middle" font-size="10.5" fill="#334155" transform="rotate(-90 492 449)">adversary budget h →</text>
  <!-- regions -->
  <rect x="512" y="374" width="120" height="75" fill="#dcfce7"/>
  <text x="572" y="408" text-anchor="middle" font-size="9.5" fill="#14532d">behavioral</text>
  <text x="572" y="420" text-anchor="middle" font-size="9.5" fill="#14532d">audit suffices</text>
  <rect x="632" y="374" width="130" height="75" fill="#fef3c7"/>
  <text x="697" y="405" text-anchor="middle" font-size="9.5" fill="#78350f">disclosure-norm</text>
  <text x="697" y="417" text-anchor="middle" font-size="9.5" fill="#78350f">required</text>
  <rect x="512" y="449" width="250" height="75" fill="#fee2e2"/>
  <text x="637" y="482" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">cryptographic / TEE attestation required</text>
  <text x="637" y="497" text-anchor="middle" font-size="9" fill="#991b1b">"TLS for model serving"</text>
  <!-- consumer point -->
  <circle cx="552" cy="514" r="5" fill="#0f172a"/>
  <text x="564" y="518" font-size="9" fill="#0f172a">R2 consumer case lands here</text>

  <!-- pilot gates -->
  <text x="668" y="562" text-anchor="middle" font-size="9.5" fill="#475569">Pilot gates:  G1 noise calib · G2 detector repro · G3 leakage/artifact · G4 economic eligibility</text>
  <text x="668" y="580" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">measured surfaces (frontier) → argued regions (this map); boundary kept explicit</text>
</svg>
