<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <!-- ===== Pilot gate band ===== -->
  <rect x="20" y="12" width="865" height="94" rx="8" fill="#fffaec" stroke="#d9a441" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="32" y="32" font-size="11.5" font-weight="bold" fill="#8a6d1f">Pilot gates — a stage runs only after its gate passes (gold chips mark the gated components)</text>

  <rect x="32" y="44" width="196" height="52" rx="5" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
  <rect x="40" y="51" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="53" y="62.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">S0</text>
  <text x="72" y="63" font-size="10.5" font-weight="bold" fill="#1a1a1a">Source verification</text>
  <text x="40" y="79" font-size="9" fill="#444">primary-source check of every relayed</text>
  <text x="40" y="90" font-size="9" fill="#444">figure; failed figures dropped, not hedged</text>

  <rect x="240" y="44" width="200" height="52" rx="5" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
  <rect x="248" y="51" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="261" y="62.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G1</text>
  <text x="280" y="63" font-size="10.5" font-weight="bold" fill="#1a1a1a">Checker bake-off</text>
  <text x="248" y="79" font-size="9" fill="#444">20 patches × 5 repos; SOC must agree</text>
  <text x="248" y="90" font-size="9" fill="#444">with adjudication or design layer is scoped</text>

  <rect x="452" y="44" width="204" height="52" rx="5" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
  <rect x="460" y="51" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="473" y="62.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G2</text>
  <text x="492" y="63" font-size="10.5" font-weight="bold" fill="#1a1a1a">Field feasibility probe</text>
  <text x="460" y="79" font-size="9" fill="#444">200 agent PRs, 50 hand-audited;</text>
  <text x="460" y="90" font-size="9" fill="#444">review-depth grid vs binary zero-review</text>

  <rect x="668" y="44" width="205" height="52" rx="5" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
  <rect x="676" y="51" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="689" y="62.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G3</text>
  <text x="708" y="63" font-size="10.5" font-weight="bold" fill="#1a1a1a">Adjudication dry-run</text>
  <text x="676" y="79" font-size="9" fill="#444">30 patches; rubric reaches κ ≥ 0.6</text>
  <text x="676" y="90" font-size="9" fill="#444">before the ~300-patch panel opens</text>

  <!-- ===== PR / patch stream ===== -->
  <rect x="25" y="240" width="148" height="140" rx="7" fill="#eef2f7" stroke="#5a7184" stroke-width="1.5"/>
  <rect x="33" y="247" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="46" y="258.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">S0</text>
  <rect x="63" y="247" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="76" y="258.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G2</text>
  <text x="99" y="279" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Agent PR /</text>
  <text x="99" y="293" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">patch stream</text>
  <text x="99" y="313" font-size="9.5" text-anchor="middle" fill="#444">public forge, agent-authored</text>
  <text x="99" y="326" font-size="9.5" text-anchor="middle" fill="#444">enrolled at first green CI</text>
  <text x="99" y="343" font-size="9.5" text-anchor="middle" fill="#444">hash-locked register</text>
  <text x="99" y="356" font-size="9.5" text-anchor="middle" fill="#444">+ LabelVault (labels sealed</text>
  <text x="99" y="369" font-size="9.5" text-anchor="middle" fill="#444">until instruments freeze)</text>

  <!-- ===== Layer 1: tests ===== -->
  <rect x="213" y="140" width="264" height="58" rx="7" fill="#e8f1fb" stroke="#3b74b8" stroke-width="1.5"/>
  <text x="345" y="161" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Layer 1 · Test-suite oracle  O_test</text>
  <text x="345" y="177" font-size="9.5" text-anchor="middle" fill="#444">earliest-head required CI, pre-review</text>
  <text x="345" y="190" font-size="9.5" text-anchor="middle" fill="#444">(review-era reruns never overwrite it)</text>

  <!-- ===== Layer 2: SOC ===== -->
  <rect x="213" y="240" width="264" height="76" rx="7" fill="#e6f4ee" stroke="#2e8b6e" stroke-width="1.5"/>
  <rect x="221" y="247" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="234" y="258.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G1</text>
  <text x="367" y="261" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Layer 2 · Design checker  O_design</text>
  <text x="345" y="278" font-size="9.5" text-anchor="middle" fill="#444">SOC: frozen coverage charter + manifest</text>
  <text x="345" y="291" font-size="9.5" text-anchor="middle" fill="#444">span-grounded obligations, executable + static</text>
  <text x="345" y="304" font-size="9.5" text-anchor="middle" fill="#444">checks; abstains instead of guessing</text>

  <!-- ===== Layer 3: review-adjusted ===== -->
  <rect x="213" y="356" width="264" height="92" rx="7" fill="#f3ecfa" stroke="#7c4fb0" stroke-width="1.5"/>
  <text x="345" y="377" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Layer 3 · Review-adjusted  O_review</text>
  <text x="345" y="395" font-size="10" font-weight="bold" text-anchor="middle" fill="#4a2a75">merged ∧ substantive review ≥ τ* ∧ S(c)</text>
  <text x="345" y="412" font-size="9.5" text-anchor="middle" fill="#444">survival conjunct S(c): no revert / defect-linked fix</text>
  <text x="345" y="425" font-size="9.5" text-anchor="middle" fill="#444">inside the construction window — kept disjoint</text>
  <text x="345" y="438" font-size="9.5" text-anchor="middle" fill="#444">from the held-out outcome window (days 31–180)</text>

  <!-- ===== Fidelity comparison ===== -->
  <rect x="520" y="225" width="207" height="177" rx="7" fill="#fdf0ec" stroke="#c05b3c" stroke-width="1.5"/>
  <rect x="528" y="232" width="26" height="15" rx="4" fill="#f5c04e" stroke="#8a6d1f" stroke-width="0.8"/>
  <text x="541" y="243.5" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#4a3a08">G3</text>
  <text x="623" y="260" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Cross-layer fidelity</text>
  <text x="623" y="274" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">comparison</text>
  <text x="623" y="296" font-size="9.5" text-anchor="middle" fill="#444">agreement A_ab · discordance D_a→b</text>
  <text x="623" y="310" font-size="9.5" text-anchor="middle" fill="#444">(prevalence-guarded)</text>
  <text x="623" y="328" font-size="9.5" text-anchor="middle" fill="#444">held-out predictive fidelity F_a</text>
  <text x="623" y="342" font-size="9.5" text-anchor="middle" fill="#444">per layer, leakage-safe landmarks</text>
  <text x="623" y="362" font-size="9.5" text-anchor="middle" fill="#444">anchored by ~350-item blinded</text>
  <text x="623" y="376" font-size="9.5" text-anchor="middle" fill="#444">human audit (2 raters + tiebreak)</text>

  <!-- ===== Field outcomes ===== -->
  <rect x="520" y="440" width="207" height="60" rx="7" fill="#fff6e8" stroke="#c08a3c" stroke-width="1.5"/>
  <text x="623" y="459" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Field merge outcomes</text>
  <text x="623" y="475" font-size="9.5" text-anchor="middle" fill="#444">technical-only rejection (day 30) ·</text>
  <text x="623" y="488" font-size="9.5" text-anchor="middle" fill="#444">BCFD-validated defects (days 31–180)</text>

  <!-- ===== Gating engine ===== -->
  <rect x="758" y="225" width="127" height="177" rx="7" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="821" y="247" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Gating engine</text>
  <text x="821" y="267" font-size="9.5" text-anchor="middle" fill="#444">F1 gap ≥ threshold</text>
  <text x="821" y="281" font-size="9.5" text-anchor="middle" fill="#444">F2 layer disagreement</text>
  <text x="821" y="295" font-size="9.5" text-anchor="middle" fill="#444">F3 oracle dominance</text>
  <text x="821" y="309" font-size="9.5" text-anchor="middle" fill="#444">F4 prediction (ext.)</text>
  <text x="821" y="323" font-size="9.5" text-anchor="middle" fill="#444">F5 dose-response (ext.)</text>
  <text x="821" y="345" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8b2c2c">kill: F1 ∧ F2</text>
  <text x="821" y="363" font-size="8.8" text-anchor="middle" fill="#666">claims tagged confirmatory /</text>
  <text x="821" y="375" font-size="8.8" text-anchor="middle" fill="#666">descriptive / reference-limited /</text>
  <text x="821" y="387" font-size="8.8" text-anchor="middle" fill="#666">org-confounding-unverified</text>

  <!-- ===== Outputs ===== -->
  <rect x="430" y="522" width="215" height="62" rx="7" fill="#eef7e8" stroke="#4e8a3a" stroke-width="1.5"/>
  <text x="537" y="543" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Reward substrate</text>
  <text x="537" y="559" font-size="9.5" text-anchor="middle" fill="#444">acceptance-grounded terminal reward;</text>
  <text x="537" y="572" font-size="9.5" text-anchor="middle" fill="#444">tests retained as shaping signal</text>

  <rect x="665" y="522" width="220" height="62" rx="7" fill="#eef7e8" stroke="#4e8a3a" stroke-width="1.5"/>
  <text x="775" y="543" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Acceptance-calibrated reporting</text>
  <text x="775" y="559" font-size="9.5" text-anchor="middle" fill="#444">resolved-rate claims carry</text>
  <text x="775" y="572" font-size="9.5" text-anchor="middle" fill="#444">oracle-calibration statements</text>

  <!-- ===== Arrows ===== -->
  <!-- PR stream to layers -->
  <line x1="173" y1="290" x2="211" y2="176" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="173" y1="300" x2="211" y2="284" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="173" y1="330" x2="211" y2="396" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- layers to comparison -->
  <line x1="477" y1="169" x2="518" y2="258" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="477" y1="284" x2="518" y2="308" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="477" y1="400" x2="518" y2="358" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- field outcomes up into comparison -->
  <line x1="623" y1="438" x2="623" y2="406" stroke="#8a6d1f" stroke-width="1.4" marker-end="url(#arrowup)"/>

  <!-- comparison to gating -->
  <line x1="729" y1="313" x2="754" y2="313" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- gating to outputs -->
  <polyline points="821,404 821,518" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <polyline points="821,506 537,506 537,518" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
