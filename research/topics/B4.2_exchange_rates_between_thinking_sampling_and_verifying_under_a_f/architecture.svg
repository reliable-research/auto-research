<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Exchange Rates of Test-Time Compute — Measurement Pipeline</text>

  <!-- ===== Column A: budget + tasks ===== -->
  <rect x="22" y="48" width="200" height="140" rx="8" fill="#fff8e6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="122" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c00">Fixed dollar budget</text>
  <text x="122" y="84" text-anchor="middle" font-size="10.5" fill="#555">price sheet &#960;0 frozen (dated)</text>
  <!-- budget bins -->
  <rect x="40" y="94" width="38" height="20" rx="3" fill="#ffe9b0" stroke="#c9a227"/>
  <rect x="88" y="94" width="38" height="20" rx="3" fill="#ffe098" stroke="#c9a227"/>
  <rect x="136" y="94" width="38" height="20" rx="3" fill="#ffd57d" stroke="#c9a227"/>
  <text x="59"  y="108" text-anchor="middle" font-size="9.5" fill="#5c4400">B1</text>
  <text x="107" y="108" text-anchor="middle" font-size="9.5" fill="#5c4400">B2</text>
  <text x="155" y="108" text-anchor="middle" font-size="9.5" fill="#5c4400">B3&#8211;4</text>
  <text x="122" y="132" text-anchor="middle" font-size="10.5" fill="#555">3&#8211;4 budget bins / family</text>
  <text x="122" y="147" text-anchor="middle" font-size="10.5" fill="#555">matched on realized cost</text>
  <text x="122" y="162" text-anchor="middle" font-size="10.5" fill="#555">(&#177;10% bins, cross-fitted)</text>
  <text x="122" y="177" text-anchor="middle" font-size="10.5" fill="#555">caps co-scale with price level</text>

  <!-- Task families -->
  <rect x="22" y="208" width="200" height="160" rx="8" fill="#f2f7ff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="122" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4fa1">Task families &#215; difficulty</text>
  <text x="38" y="248" font-size="10.5" fill="#333">code &#8226; executable tests</text>
  <text x="38" y="264" font-size="10.5" fill="#333">math &#8226; MATH-500 / AIME</text>
  <text x="38" y="280" font-size="10.5" fill="#333">MCQ &#8226; GPQA-Diamond</text>
  <text x="38" y="296" font-size="10.5" fill="#333">open QA &#8226; FRAMES (rubric)</text>
  <line x1="200" y1="242" x2="200" y2="296" stroke="#5b8def" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="209" y="272" font-size="9" fill="#1d4fa1" transform="rotate(90 209 272)">verifiability &#8595;</text>
  <text x="38" y="320" font-size="10.5" fill="#555">strata: easy / medium / hard</text>
  <text x="38" y="336" font-size="10.5" fill="#555">(pilot-estimated solve rate)</text>
  <text x="38" y="356" font-size="10.5" fill="#555">pilot: math+code &#8594; full: 4 fam.</text>

  <!-- Pilot gates -->
  <rect x="22" y="452" width="200" height="146" rx="8" fill="#eefaef" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="122" y="472" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d32">Pilot gates (go/no-go)</text>
  <text x="38" y="492" font-size="10.5" fill="#333">(i) &#8805;25 configs/family in bins</text>
  <text x="38" y="508" font-size="10.5" fill="#333">(ii) frontier non-degenerate</text>
  <text x="38" y="524" font-size="10.5" fill="#333">(&#8805;3 mixes; corner &#8658; report)</text>
  <text x="38" y="540" font-size="10.5" fill="#333">(iii) verifier beats V0 at</text>
  <text x="38" y="556" font-size="10.5" fill="#333">matched cost somewhere</text>
  <text x="38" y="578" font-size="10.5" font-weight="bold" fill="#2e7d32">GO &#8658; scale-up A2/A3/A4</text>

  <!-- ===== Column B: three channels ===== -->
  <rect x="258" y="48" width="218" height="320" rx="8" fill="#fbfbfb" stroke="#888" stroke-width="1.5"/>
  <text x="367" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Three compute channels</text>

  <rect x="272" y="80" width="190" height="72" rx="6" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.3"/>
  <text x="367" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4fa1">Thinking &#8212; cap L</text>
  <text x="367" y="114" text-anchor="middle" font-size="10.5" fill="#333">512 &#183; 1024 &#183; 2048 &#183; 4096 tok</text>
  <text x="367" y="130" text-anchor="middle" font-size="10" fill="#555">budget forcing (s1-style)</text>
  <text x="367" y="144" text-anchor="middle" font-size="10" fill="#555">open-weight primary instrument</text>

  <rect x="272" y="162" width="190" height="60" rx="6" fill="#e9f7ec" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="367" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e7d32">Sampling &#8212; N candidates</text>
  <text x="367" y="196" text-anchor="middle" font-size="10.5" fill="#333">N &#8712; {1, 2, 4, 8, 16} @ T = 0.8</text>
  <text x="367" y="211" text-anchor="middle" font-size="10" fill="#555">coverage &#8800; accuracy</text>

  <rect x="272" y="232" width="190" height="86" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.3"/>
  <text x="367" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">Verifying &#8212; selection V</text>
  <text x="367" y="266" text-anchor="middle" font-size="10.5" fill="#333">V0 (0$) &#183; cheap judge &#183; strong</text>
  <text x="367" y="281" text-anchor="middle" font-size="10" fill="#555">selection-only (no revision)</text>
  <text x="367" y="296" text-anchor="middle" font-size="10" fill="#555">+ oracle arm (dashed ref,</text>
  <text x="367" y="310" text-anchor="middle" font-size="10" fill="#555">excluded from cost claims)</text>

  <text x="367" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">verifier tokens charged</text>
  <text x="367" y="357" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">inside the same budget</text>

  <!-- Verifier-cost accounting / ledger -->
  <rect x="258" y="452" width="218" height="146" rx="8" fill="#f4f0fa" stroke="#7d5ba6" stroke-width="1.5"/>
  <text x="367" y="472" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b3f85">Dollar-cost ledger</text>
  <text x="274" y="492" font-size="10.5" fill="#333">per call: (in, out, role) tokens</text>
  <text x="274" y="508" font-size="10.5" fill="#333">$ = &#960;0 &#183; r(q,x); verifier in/out</text>
  <text x="274" y="524" font-size="10.5" fill="#333">metered like the generator</text>
  <text x="274" y="542" font-size="10.5" fill="#555">bases: GPU-amortized +</text>
  <text x="274" y="557" font-size="10.5" fill="#555">hosted list price (same weights)</text>
  <text x="274" y="576" font-size="10.5" font-weight="bold" fill="#5b3f85">ledger frozen &#8658; repriceable</text>

  <!-- ===== Column C: estimation ===== -->
  <rect x="512" y="48" width="188" height="96" rx="8" fill="#fbfbfb" stroke="#888" stroke-width="1.5"/>
  <text x="606" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Matched-cost bins</text>
  <text x="606" y="86" text-anchor="middle" font-size="10.5" fill="#555">expected-cost pre-screen</text>
  <text x="606" y="101" text-anchor="middle" font-size="10.5" fill="#555">~35 configs / family (pilot)</text>
  <text x="606" y="116" text-anchor="middle" font-size="10.5" fill="#555">realized cost per query;</text>
  <text x="606" y="131" text-anchor="middle" font-size="10.5" fill="#555">in-bin regression adjust</text>

  <rect x="512" y="170" width="188" height="128" rx="8" fill="#fbfbfb" stroke="#888" stroke-width="1.5"/>
  <text x="606" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Exchange-rate estimation</text>
  <text x="606" y="208" text-anchor="middle" font-size="10.5" fill="#555">surface f&#770;(L,N,V,c) with</text>
  <text x="606" y="223" text-anchor="middle" font-size="10.5" fill="#555">N&#215;V, L&#215;V interaction terms</text>
  <text x="606" y="240" text-anchor="middle" font-size="10.5" fill="#333">gain/$ G &#8226; MRS at interior</text>
  <text x="606" y="255" text-anchor="middle" font-size="10.5" fill="#333">frontier points &#8226; LR tests</text>
  <text x="606" y="272" text-anchor="middle" font-size="10.5" fill="#555">bootstrap bands (10k, by</text>
  <text x="606" y="287" text-anchor="middle" font-size="10.5" fill="#555">question cluster)</text>

  <rect x="512" y="324" width="188" height="112" rx="8" fill="#fbfbfb" stroke="#888" stroke-width="1.5"/>
  <text x="606" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Frontier &amp; allocation mix</text>
  <text x="606" y="362" text-anchor="middle" font-size="10.5" fill="#555">accuracy-per-$ frontier</text>
  <text x="606" y="377" text-anchor="middle" font-size="10.5" fill="#333">mix (s_think, s_samp, s_ver) &#8712; &#916;&#178;</text>
  <text x="606" y="394" text-anchor="middle" font-size="10.5" fill="#555">cross-family stability:</text>
  <text x="606" y="409" text-anchor="middle" font-size="10.5" fill="#555">Aitchison + permutation</text>
  <text x="606" y="424" text-anchor="middle" font-size="10.5" fill="#555">test (H2 ordering)</text>

  <!-- ===== Column D: repricing + claims ===== -->
  <rect x="726" y="48" width="152" height="180" rx="8" fill="#f4f0fa" stroke="#7d5ba6" stroke-width="1.5"/>
  <text x="802" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b3f85">Repricing &#177;3&#215;</text>
  <text x="802" y="86" text-anchor="middle" font-size="10.5" fill="#555">fixed-quantity inner</text>
  <text x="802" y="101" text-anchor="middle" font-size="10.5" fill="#555">product on frozen ledger</text>
  <text x="802" y="118" text-anchor="middle" font-size="10.5" fill="#333">perturb in:out and</text>
  <text x="802" y="133" text-anchor="middle" font-size="10.5" fill="#333">verifier:generator ratios</text>
  <text x="802" y="150" text-anchor="middle" font-size="10.5" fill="#555">bins + frontier recomputed</text>
  <text x="802" y="165" text-anchor="middle" font-size="10.5" fill="#555">at each price point</text>
  <text x="802" y="182" text-anchor="middle" font-size="10.5" fill="#555">dual bases: GPU-amortized</text>
  <text x="802" y="197" text-anchor="middle" font-size="10.5" fill="#555">&amp; hosted list price</text>
  <text x="802" y="214" text-anchor="middle" font-size="10.5" fill="#555">+ free-verifier comparator</text>

  <rect x="726" y="256" width="152" height="180" rx="8" fill="#eefaef" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="802" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Claim hierarchy</text>
  <text x="802" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">Tier-1 (headline)</text>
  <text x="802" y="311" text-anchor="middle" font-size="10.5" fill="#555">lever orderings +</text>
  <text x="802" y="326" text-anchor="middle" font-size="10.5" fill="#555">interaction signs, invariant</text>
  <text x="802" y="341" text-anchor="middle" font-size="10.5" fill="#555">over full &#177;3&#215; region</text>
  <text x="802" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">Tier-2 (dated)</text>
  <text x="802" y="375" text-anchor="middle" font-size="10.5" fill="#555">numeric MRS, appendix,</text>
  <text x="802" y="390" text-anchor="middle" font-size="10.5" fill="#555">price-regime-specific</text>
  <text x="802" y="409" text-anchor="middle" font-size="10.5" fill="#555">retention (&#8805;80% volume)</text>
  <text x="802" y="424" text-anchor="middle" font-size="10.5" fill="#555">reported separately</text>

  <rect x="726" y="452" width="152" height="146" rx="8" fill="#fff8e6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="802" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">Outputs</text>
  <text x="802" y="492" text-anchor="middle" font-size="10.5" fill="#333">H1: budget-dependent</text>
  <text x="802" y="507" text-anchor="middle" font-size="10.5" fill="#333">rates, interior L*</text>
  <text x="802" y="524" text-anchor="middle" font-size="10.5" fill="#333">H2: mix ordered by</text>
  <text x="802" y="539" text-anchor="middle" font-size="10.5" fill="#333">verifiability</text>
  <text x="802" y="556" text-anchor="middle" font-size="10.5" fill="#333">H3: N&#215;V &gt; 0,</text>
  <text x="802" y="571" text-anchor="middle" font-size="10.5" fill="#333">L&#215;V &lt; 0</text>
  <text x="802" y="588" text-anchor="middle" font-size="10.5" fill="#555">+ dated MRS table</text>

  <!-- ===== Arrows ===== -->
  <!-- budget -> channels -->
  <line x1="222" y1="118" x2="256" y2="118" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- tasks -> channels -->
  <line x1="222" y1="288" x2="256" y2="288" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- channels -> bins -->
  <line x1="476" y1="96" x2="510" y2="96" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- channels -> ledger (down) -->
  <line x1="367" y1="368" x2="367" y2="450" stroke="#7d5ba6" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="378" y="416" font-size="9.5" fill="#5b3f85">usage logs</text>
  <!-- ledger -> bins (up-right) -->
  <path d="M 476 480 C 496 470, 496 300, 508 122" fill="none" stroke="#7d5ba6" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="490" y="310" font-size="9.5" fill="#5b3f85" transform="rotate(-90 490 310)">realized $</text>
  <!-- bins -> estimation -->
  <line x1="606" y1="144" x2="606" y2="168" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- estimation -> frontier -->
  <line x1="606" y1="298" x2="606" y2="322" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- estimation -> repricing -->
  <line x1="700" y1="210" x2="724" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- frontier -> repricing -->
  <line x1="700" y1="360" x2="724" y2="330" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- repricing -> claims -->
  <line x1="802" y1="228" x2="802" y2="254" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- claims -> outputs -->
  <line x1="802" y1="436" x2="802" y2="450" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- pilot gates -> scale-up (dashed, to channels) -->
  <path d="M 122 452 C 122 400, 180 388, 256 368" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <text x="138" y="412" font-size="9.5" fill="#2e7d32">gates scale-up (A1 &#8594; A2/A3/A4)</text>
</svg>
