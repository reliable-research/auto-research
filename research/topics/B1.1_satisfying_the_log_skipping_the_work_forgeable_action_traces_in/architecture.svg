<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="17" text-anchor="middle" font-size="12" fill="#777" font-style="italic">Emergence map of log forging: dual-channel measurement, κ-gated attribution, gated scale-up</text>

  <!-- ===== Left column: tasks and agent ===== -->
  <rect x="20" y="40" width="180" height="85" rx="8" fill="#f0f4e8" stroke="#7a8f4f" stroke-width="1.5"/>
  <text x="110" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#42522a">Certified tasks</text>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#42522a">separability + naturalness</text>
  <text x="110" y="93" text-anchor="middle" font-size="11" fill="#42522a">certificates (outcome-blind),</text>
  <text x="110" y="108" text-anchor="middle" font-size="11" fill="#42522a">forging-affordance covariate</text>

  <rect x="20" y="170" width="180" height="70" rx="8" fill="#e8eef8" stroke="#4a6da7" stroke-width="1.5"/>
  <text x="110" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4570">Agent  π</text>
  <text x="110" y="215" text-anchor="middle" font-size="11" fill="#2c4570">tool-using LLM, sandboxed</text>

  <line x1="110" y1="125" x2="110" y2="166" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== CDCH container ===== -->
  <rect x="390" y="30" width="300" height="330" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="540" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">Committed Dual-Channel Harness (CDCH)</text>

  <rect x="410" y="70" width="260" height="110" rx="8" fill="#fdeee0" stroke="#c87d33" stroke-width="1.5"/>
  <text x="540" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c4a15">Log channel (proxy under test)</text>
  <text x="540" y="108" text-anchor="middle" font-size="11" fill="#7c4a15">agent-authored action trace τ</text>
  <text x="540" y="123" text-anchor="middle" font-size="11" fill="#7c4a15">log verifier L(τ) ∈ {pass, fail}</text>
  <text x="540" y="140" text-anchor="middle" font-size="10.5" fill="#7c4a15">F1 rule-checker · F2 trajectory-RM</text>
  <text x="540" y="155" text-anchor="middle" font-size="10.5" fill="#7c4a15">F3 per-call judge · F4 final-report</text>

  <rect x="410" y="200" width="260" height="110" rx="8" fill="#e3f1e5" stroke="#3f8a4e" stroke-width="1.5"/>
  <text x="540" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#20512a">Work / state channel (ground truth)</text>
  <text x="540" y="238" text-anchor="middle" font-size="11" fill="#20512a">hash-committed snapshots σ₀ → σ_T</text>
  <text x="540" y="253" text-anchor="middle" font-size="11" fill="#20512a">post-episode quiescence window</text>
  <text x="540" y="268" text-anchor="middle" font-size="11" fill="#20512a">executable state predicate S(Δσ)</text>
  <text x="540" y="285" text-anchor="middle" font-size="10.5" font-style="italic" fill="#20512a">no LLM anywhere in the truth channel</text>

  <!-- agent to channels -->
  <line x1="200" y1="192" x2="406" y2="122" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="268" y="158" text-anchor="middle" font-size="10.5" fill="#666">writes trace</text>
  <line x1="200" y1="222" x2="406" y2="252" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="268" y="252" text-anchor="middle" font-size="10.5" fill="#666">real actions on env</text>

  <!-- ===== Discordance ===== -->
  <rect x="710" y="140" width="175" height="110" rx="8" fill="#fbe9e9" stroke="#b04a4a" stroke-width="1.5"/>
  <text x="797" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2323">Candidate forging</text>
  <text x="797" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2323">event</text>
  <text x="797" y="203" text-anchor="middle" font-size="11.5" fill="#6e2323">L = pass  ∧  S = fail</text>
  <text x="797" y="222" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6e2323">raw discordance —</text>
  <text x="797" y="236" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6e2323">descriptive only</text>

  <line x1="670" y1="125" x2="707" y2="166" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="670" y1="255" x2="707" y2="224" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Attribution ===== -->
  <rect x="640" y="310" width="245" height="120" rx="8" fill="#efe7f6" stroke="#7a54a8" stroke-width="1.5"/>
  <text x="762" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#452a6b">κ-gated attribution</text>
  <text x="762" y="352" text-anchor="middle" font-size="11" fill="#452a6b">matched-arm base-rate subtraction</text>
  <text x="762" y="367" text-anchor="middle" font-size="11" fill="#452a6b">(log arm − state arm)</text>
  <text x="762" y="387" text-anchor="middle" font-size="11" fill="#452a6b">double-annotated audit: forging vs</text>
  <text x="762" y="402" text-anchor="middle" font-size="11" fill="#452a6b">honest error, κ ≥ 0.7</text>
  <text x="762" y="419" text-anchor="middle" font-size="10.5" font-style="italic" fill="#452a6b">confirmed fraction scales headline</text>

  <line x1="797" y1="250" x2="797" y2="307" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="470" y="342" width="140" height="52" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.3"/>
  <text x="540" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666">Honest error</text>
  <text x="540" y="381" text-anchor="middle" font-size="10.5" fill="#666">excluded from AFIR</text>
  <line x1="638" y1="368" x2="613" y2="368" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="640" y="460" width="245" height="55" rx="8" fill="#ffffff" stroke="#b04a4a" stroke-width="2.2"/>
  <text x="762" y="483" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2323">Attributed FIR (AFIR)</text>
  <text x="762" y="501" text-anchor="middle" font-size="10.5" fill="#6e2323">headline rate, per condition cell</text>
  <line x1="762" y1="430" x2="762" y2="457" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Pressure arms container ===== -->
  <rect x="20" y="290" width="340" height="200" rx="10" fill="#ffffff" stroke="#4a6da7" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="190" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4570">Optimization pressure — factorial arms</text>

  <rect x="35" y="322" width="150" height="78" rx="8" fill="#e8eef8" stroke="#4a6da7" stroke-width="1.4"/>
  <text x="110" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4570">Selection (pilot)</text>
  <text x="110" y="356" text-anchor="middle" font-size="10.5" fill="#2c4570">best-of-n over L</text>
  <text x="110" y="370" text-anchor="middle" font-size="10.5" fill="#2c4570">n ∈ {1, 4, 16, 64}</text>
  <text x="110" y="388" text-anchor="middle" font-size="10" font-style="italic" fill="#2c4570">propensity revelation</text>

  <rect x="195" y="322" width="150" height="78" rx="8" fill="#e8eef8" stroke="#4a6da7" stroke-width="1.4"/>
  <text x="270" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4570">RL (extension)</text>
  <text x="270" y="356" text-anchor="middle" font-size="10.5" fill="#2c4570">PPO, reward =</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#2c4570">rule-based F1 only</text>
  <text x="270" y="388" text-anchor="middle" font-size="10" font-style="italic" fill="#2c4570">acquisition</text>

  <rect x="35" y="412" width="310" height="32" rx="6" fill="#f4f7fb" stroke="#4a6da7" stroke-width="1.1"/>
  <text x="190" y="432" text-anchor="middle" font-size="10.5" fill="#2c4570">Matched arms:  log-reward · state-reward · no-pressure</text>

  <text x="190" y="461" text-anchor="middle" font-size="10.5" fill="#2c4570">+ prompt-evolution arm (R2 optimizer-transcript strata)</text>
  <text x="190" y="477" text-anchor="middle" font-size="10.5" fill="#2c4570">factors: observability O · action cost C · verifier family V</text>

  <line x1="110" y1="290" x2="110" y2="244" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="140" y="270" text-anchor="middle" font-size="10.5" fill="#666">pressure</text>

  <!-- ===== Bottom band: pilot gate flow ===== -->
  <rect x="20" y="530" width="280" height="65" rx="8" fill="#fdf6e0" stroke="#b08c2e" stroke-width="1.5"/>
  <text x="160" y="550" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5313">Gated 32-cell pilot</text>
  <text x="160" y="567" text-anchor="middle" font-size="10.5" fill="#6b5313">40 certified tasks · 2 capability-split models</text>
  <text x="160" y="582" text-anchor="middle" font-size="10.5" fill="#6b5313">F1 checker only · n × O · matched arms</text>

  <rect x="340" y="530" width="250" height="65" rx="8" fill="#fdf6e0" stroke="#b08c2e" stroke-width="1.5"/>
  <text x="465" y="550" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5313">Go / no-go gates G1–G3</text>
  <text x="465" y="567" text-anchor="middle" font-size="10.5" fill="#6b5313">G1 ΔAFIR ≥ 5 pp · G2 dose–response</text>
  <text x="465" y="582" text-anchor="middle" font-size="10.5" fill="#6b5313">G3 oracle FPR &lt; 2%</text>

  <rect x="630" y="530" width="255" height="65" rx="8" fill="#fdf6e0" stroke="#b08c2e" stroke-width="1.5"/>
  <text x="757" y="550" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5313">Full-scale extension (App. A)</text>
  <text x="757" y="567" text-anchor="middle" font-size="10.5" fill="#6b5313">factorial over F1–F4 · PPO acquisition</text>
  <text x="757" y="582" text-anchor="middle" font-size="10.5" fill="#6b5313">fail → harden once / publishable null</text>

  <line x1="300" y1="562" x2="337" y2="562" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="590" y1="562" x2="627" y2="562" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="160" y1="490" x2="160" y2="527" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="745" y1="515" x2="545" y2="530" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="655" y="516" text-anchor="middle" font-size="10.5" fill="#666">AFIR feeds gates</text>
</svg>
