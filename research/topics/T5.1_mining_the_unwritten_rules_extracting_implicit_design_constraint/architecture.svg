  <text x="320" y="566" font-size="11.5" font-weight="bold" fill="#7a5a10">G2 · ~Sep 11</text>
  <text x="320" y="582" font-size="11" fill="#333">judge &#954; &#8805; 0.6 in every category</text>

  <line x1="550" y1="570" x2="572" y2="570" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="574" y="548" width="130" height="44" rx="8" fill="#fbeecb" stroke="#c99b3f"/>
  <text x="584" y="566" font-size="11.5" font-weight="bold" fill="#7a5a10">G3 · ~Sep 18</text>
  <text x="584" y="582" font-size="11" fill="#333">&#8805;300 patches</text>

  <text x="716" y="560" font-size="10.5" fill="#3a3a44">descope: breadth probe &#8594; outcome</text>
  <text x="716" y="574" font-size="10.5" fill="#3a3a44">linkage &#8594; 3 repos / 300 patches;</text>
