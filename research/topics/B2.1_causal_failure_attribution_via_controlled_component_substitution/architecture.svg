<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#E07B39"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#FFFFFF"/>
  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">CapsuleBench: certified fault injection for causal failure attribution</text>
  <text x="450" y="38" text-anchor="middle" font-size="10" fill="#666">label ℓ = c exists iff (single injected fault) ∧ (outcome flip) ∧ (controls null) — no human judgment in the label path</text>

  <!-- ===================== Column A: agent pipeline substrate ===================== -->
  <text x="117" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2A5DA8">Agent pipeline substrate</text>
  <rect x="15" y="68" width="205" height="30" rx="5" fill="#E8F0FE" stroke="#4285C8" stroke-width="1.2"/>
  <text x="117" y="80" text-anchor="middle" font-size="9.5" fill="#1a1a1a">Task + snapshotted environment</text>
  <text x="117" y="92" text-anchor="middle" font-size="8.5" fill="#444">pinned tools · cached backends · 5 families</text>

  <rect x="40" y="108" width="155" height="26" rx="5" fill="#E8F0FE" stroke="#4285C8" stroke-width="1.2"/>
  <text x="117" y="125" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Plan</text>

  <rect x="40" y="142" width="155" height="38" rx="5" fill="#DDE9FB" stroke="#2A5DA8" stroke-width="1.6"/>
  <text x="117" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Executor (backbone b)</text>
  <text x="117" y="172" text-anchor="middle" font-size="8.5" fill="#2A5DA8">held FIXED per corpus tier</text>

  <rect x="40" y="188" width="155" height="26" rx="5" fill="#E8F0FE" stroke="#4285C8" stroke-width="1.2"/>
  <text x="117" y="205" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Tool call</text>

  <rect x="40" y="222" width="155" height="26" rx="5" fill="#E8F0FE" stroke="#4285C8" stroke-width="1.2"/>
  <text x="117" y="239" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Observation</text>

  <rect x="40" y="256" width="155" height="26" rx="5" fill="#FFFFFF" stroke="#4285C8" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="117" y="268" text-anchor="middle" font-size="9.5" fill="#1a1a1a">Deterministic oracle</text>
  <text x="117" y="278" text-anchor="middle" font-size="8.5" fill="#444">pass / fail</text>

  <line x1="117" y1="98" x2="117" y2="106" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="117" y1="134" x2="117" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="117" y1="180" x2="117" y2="186" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="117" y1="214" x2="117" y2="220" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="117" y1="248" x2="117" y2="254" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- loop observation -> executor -->
  <path d="M 195 235 C 218 235, 218 161, 197 161" fill="none" stroke="#4285C8" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <text x="117" y="298" text-anchor="middle" font-size="8.5" fill="#444">checkpointable · replayable · temperature 0</text>
  <text x="117" y="310" text-anchor="middle" font-size="8.5" fill="#444">reproducibility gate: base run majority-success</text>

  <!-- ===================== Column B: fault-injection matrix ===================== -->
  <text x="342" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#B65C1E">Fault-injection matrix (3 classes)</text>

  <rect x="255" y="68" width="175" height="60" rx="5" fill="#FDECE3" stroke="#E07B39" stroke-width="1.2"/>
  <text x="342" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">δ_plan — plan corruption</text>
  <text x="342" y="96" text-anchor="middle" font-size="8.5" fill="#444">delete / reorder / replace step,</text>
  <text x="342" y="108" text-anchor="middle" font-size="8.5" fill="#444">infeasible sub-goal, bad planner prompt</text>
  <text x="342" y="121" text-anchor="middle" font-size="8" fill="#B65C1E">40+ templates · severity pre-registered</text>

  <rect x="255" y="136" width="175" height="60" rx="5" fill="#FDECE3" stroke="#E07B39" stroke-width="1.2"/>
  <text x="342" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">δ_tool — tool breakage</text>
  <text x="342" y="164" text-anchor="middle" font-size="8.5" fill="#444">error stub, empty / malformed return,</text>
  <text x="342" y="176" text-anchor="middle" font-size="8.5" fill="#444">wrong-signature swap</text>
  <text x="342" y="189" text-anchor="middle" font-size="8" fill="#B65C1E">faulty implementation rebind</text>

  <rect x="255" y="204" width="175" height="60" rx="5" fill="#FDECE3" stroke="#E07B39" stroke-width="1.2"/>
  <text x="342" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">δ_obs — observation pollution</text>
  <text x="342" y="232" text-anchor="middle" font-size="8.5" fill="#444">contradiction, noise, truncation,</text>
  <text x="342" y="244" text-anchor="middle" font-size="8.5" fill="#444">schema-valid falsehood (signal-free)</text>
  <text x="342" y="257" text-anchor="middle" font-size="8" fill="#B65C1E">payload rewrite en route to executor</text>

  <text x="342" y="282" text-anchor="middle" font-size="8.5" fill="#444">one fault per trajectory, injected at step s*</text>
  <text x="342" y="294" text-anchor="middle" font-size="8.5" fill="#444">message-level edits — never weight surgery</text>
  <text x="342" y="306" text-anchor="middle" font-size="8.5" fill="#444">lineage tag + decidable trigger per capsule</text>

  <!-- injection arrows B -> A -->
  <line x1="253" y1="98" x2="199" y2="118" stroke="#E07B39" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arrO)"/>
  <line x1="253" y1="166" x2="199" y2="199" stroke="#E07B39" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arrO)"/>
  <line x1="253" y1="234" x2="199" y2="236" stroke="#E07B39" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arrO)"/>

  <!-- B -> C -->
  <line x1="432" y1="166" x2="458" y2="166" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===================== Column C: certification lattice ===================== -->
  <text x="552" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1E7A4E">Certification lattice (k = 4 replays)</text>

  <rect x="462" y="68" width="180" height="46" rx="5" fill="#E6F4EA" stroke="#34A06B" stroke-width="1.2"/>
  <text x="552" y="83" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a1a1a">1 · Identity replay δ_id</text>
  <text x="552" y="96" text-anchor="middle" font-size="8.5" fill="#444">zero edit — FlipRate ≤ 0.05</text>
  <text x="552" y="108" text-anchor="middle" font-size="8" fill="#1E7A4E">bounds intrinsic stochasticity</text>

  <rect x="462" y="122" width="180" height="46" rx="5" fill="#E6F4EA" stroke="#34A06B" stroke-width="1.2"/>
  <text x="552" y="137" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a1a1a">2 · Class-matched no-op δ_∅ᶜ</text>
  <text x="552" y="150" text-anchor="middle" font-size="8.5" fill="#444">same edit pathway, no fault — FlipRate ≤ 0.10</text>
  <text x="552" y="162" text-anchor="middle" font-size="8" fill="#1E7A4E">proves the pathway is inert (audited κ ≥ 0.7)</text>

  <rect x="462" y="176" width="180" height="46" rx="5" fill="#E6F4EA" stroke="#34A06B" stroke-width="1.2"/>
  <text x="552" y="191" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a1a1a">3 · Fault arm δ_c</text>
  <text x="552" y="204" text-anchor="middle" font-size="8.5" fill="#444">majority-success → majority-failure flip</text>
  <text x="552" y="216" text-anchor="middle" font-size="8" fill="#1E7A4E">sufficient difference-maker vs this base</text>

  <rect x="462" y="230" width="180" height="46" rx="5" fill="#E6F4EA" stroke="#34A06B" stroke-width="1.2"/>
  <text x="552" y="245" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a1a1a">4 · Bypass + lineage certificate</text>
  <text x="552" y="258" text-anchor="middle" font-size="8.5" fill="#444">trigger off → pass restored;</text>
  <text x="552" y="270" text-anchor="middle" font-size="8" fill="#1E7A4E">tag-to-oracle trace excludes downstream symptoms</text>

  <rect x="462" y="286" width="180" height="44" rx="5" fill="#D2EAD9" stroke="#1E7A4E" stroke-width="1.5"/>
  <text x="552" y="301" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a1a1a">Label ℓ = c iff all four hold</text>
  <text x="552" y="314" text-anchor="middle" font-size="8.5" fill="#444">else discard: inject ≠ cause</text>
  <text x="552" y="325" text-anchor="middle" font-size="8" fill="#1E7A4E">RQ1 validity: FlipRate(δ_c) − FlipRate(δ_∅ᶜ) ≥ 0.20</text>

  <!-- C -> D corpus (elbow) -->
  <path d="M 644 306 L 660 306 L 660 88 L 671 88" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===================== Column D: corpus + method zoo ===================== -->
  <rect x="675" y="60" width="210" height="54" rx="5" fill="#FDF6DD" stroke="#C9A227" stroke-width="1.5"/>
  <text x="780" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Certified corpus (CO1)</text>
  <text x="780" y="89" text-anchor="middle" font-size="8.5" fill="#444">versioned tiers corpus-v1-⟨scaffold⟩-⟨backbone⟩</text>
  <text x="780" y="102" text-anchor="middle" font-size="8.5" fill="#444">two-tier labels: component c + step s*</text>

  <line x1="780" y1="114" x2="780" y2="124" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="675" y="126" width="210" height="118" rx="5" fill="#F3E8FD" stroke="#8E5BC0" stroke-width="1.2"/>
  <text x="780" y="141" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Method-zoo evaluation (CO3)</text>
  <text x="780" y="156" text-anchor="middle" font-size="8.5" fill="#444">LLM-judge ×3 · B0-b heuristic floor · ablation</text>
  <text x="780" y="168" text-anchor="middle" font-size="8.5" fill="#444">do-then-verify · mutation-kill · random / majority</text>
  <text x="780" y="180" text-anchor="middle" font-size="8.5" fill="#6A3FA0">+ crossover diagnoser (protocol, lower left)</text>
  <text x="780" y="196" text-anchor="middle" font-size="8" fill="#444">component Acc (primary) · step Acc (secondary)</text>
  <text x="780" y="207" text-anchor="middle" font-size="8" fill="#444">3×3 confusion + upstream-blame bias · ECE</text>
  <text x="780" y="218" text-anchor="middle" font-size="8" fill="#444">budget-matched regimes · abstention scored</text>
  <text x="780" y="234" text-anchor="middle" font-size="8" fill="#6A3FA0">contrast: Who&amp;When natural failures (gap reported)</text>

  <!-- rail from gate box to bottom boxes -->
  <line x1="552" y1="330" x2="552" y2="348" stroke="#555" stroke-width="1.4"/>
  <line x1="155" y1="348" x2="745" y2="348" stroke="#555" stroke-width="1.2"/>
  <text x="352" y="343" text-anchor="middle" font-size="8.5" fill="#444">certified trials (ℓ = c, s*) feed the protocol and both absorbed axes</text>
  <line x1="155" y1="348" x2="155" y2="366" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="450" y1="348" x2="450" y2="366" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="745" y1="348" x2="745" y2="366" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ===================== Bottom row ===================== -->
  <rect x="15" y="370" width="280" height="150" rx="6" fill="#F3E8FD" stroke="#8E5BC0" stroke-width="1.3"/>
  <text x="155" y="386" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Controlled substitution protocol</text>
  <text x="155" y="399" text-anchor="middle" font-size="8.5" fill="#6A3FA0">Crossover Evidence Pack — interventional reference</text>
  <text x="27" y="416" font-size="8.5" fill="#444">• fault transfer: clean run + faulty component twin</text>
  <text x="27" y="429" font-size="8.5" fill="#444">• clean repair: faulty run + clean component twin</text>
  <text x="27" y="442" font-size="8.5" fill="#444">• twins = transition impl + owned prestate only</text>
  <text x="27" y="455" font-size="8.5" fill="#444">• outcome-blind admissibility (keys, invariants,</text>
  <text x="27" y="467" font-size="8.5" fill="#444">&#160;&#160;sandbox, hash fixity, self-transplant)</text>
  <text x="27" y="481" font-size="8.5" fill="#444">• bidirectional crossover at earliest boundary</text>
  <text x="27" y="494" font-size="8.5" fill="#444">• incomplete / inadmissible evidence → abstain</text>
  <text x="27" y="509" font-size="8" fill="#6A3FA0">repair-only + trace-only ablations isolate its value (RQ4)</text>

  <rect x="310" y="370" width="280" height="150" rx="6" fill="#E0F2F1" stroke="#2E8B8B" stroke-width="1.3"/>
  <text x="450" y="386" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Cross-backbone axis (absorbed B2.3)</text>
  <text x="450" y="399" text-anchor="middle" font-size="8.5" fill="#1F6E6E">swap the FIXED executor backbone → re-certify</text>
  <text x="322" y="416" font-size="8.5" fill="#444">• per-backbone certified tiers (pinned open weights)</text>
  <text x="322" y="429" font-size="8.5" fill="#444">• label survival rate per class — non-transfer is an</text>
  <text x="322" y="441" font-size="8.5" fill="#444">&#160;&#160;expected, measured outcome</text>
  <text x="322" y="455" font-size="8.5" fill="#444">• per-method accuracy Δ on surviving intersection</text>
  <text x="322" y="468" font-size="8.5" fill="#444">• diagnosis-stability confusion table</text>
  <text x="322" y="483" font-size="8.5" fill="#444">• ~300 trials × k = 4 on local GPUs</text>
  <text x="450" y="509" text-anchor="middle" font-size="8" fill="#1F6E6E">RQ6 — no existing artifact reports label survival</text>

  <rect x="605" y="370" width="280" height="150" rx="6" fill="#EDF4FB" stroke="#4A7DB5" stroke-width="1.3"/>
  <text x="745" y="386" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a">Replay-budget axis (absorbed B2.2)</text>
  <text x="745" y="399" text-anchor="middle" font-size="8.5" fill="#2A5DA8">meter causal evidence: replays from checkpoint</text>
  <text x="617" y="416" font-size="8.5" fill="#444">• nested budgets C ∈ {0, 2, 4, 8, 16} (prefix reuse)</text>
  <text x="617" y="429" font-size="8.5" fill="#444">• accuracy-per-replay curves; token cost secondary</text>
  <text x="617" y="442" font-size="8.5" fill="#444">• budget-matched judge = regime-fairness control</text>
  <text x="617" y="455" font-size="8.5" fill="#444">• saturation check: |Acc(8) − Acc(16)| ≤ 0.03</text>
  <text x="617" y="468" font-size="8.5" fill="#444">• certification k-sensitivity: k ∈ {2, 4, 8}</text>
  <text x="617" y="481" font-size="8.5" fill="#444">&#160;&#160;on a 50-trial subsample</text>
  <text x="745" y="509" text-anchor="middle" font-size="8" fill="#2A5DA8">RQ5 — what does causal evidence cost?</text>

  <!-- ===================== Pilot gates bar ===================== -->
  <rect x="15" y="532" width="870" height="56" rx="6" fill="#FBEAEA" stroke="#C0504D" stroke-width="1.3"/>
  <text x="450" y="548" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8A2E2B">Pilot gates (pre-registered, cut before build — never at deadline)</text>
  <text x="450" y="563" text-anchor="middle" font-size="8.5" fill="#444">walking skeleton: 20 tasks × 4 arms, go/no-go — yield ≥ 12 · no-op crash ≤ 10% · flip-gap ≥ 0.20 · identity flips ≤ 1 · ≥ 10 labeled trajectories</text>
  <text x="450" y="577" text-anchor="middle" font-size="8.5" fill="#444">powered-cell rule: cells &lt; 80 certified trials → INCONCLUSIVE &#160;·&#160; descope ladder D1–D4 &#160;·&#160; negative-result pivot pre-named (substitution premise fails)</text>
</svg>
